<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="#f7f8fa"/>
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Rear traction geometry — the drive-bite picture (side view)</text>
  <text x="480" y="52" text-anchor="middle" font-size="12.5" fill="#64748b">car accelerating to the right · schematic, not to construction scale</text>

  <!-- ground -->
  <line x1="60" y1="450" x2="905" y2="450" stroke="#cbd5e1" stroke-width="2"/>

  <!-- wheels -->
  <circle cx="230" cy="398" r="52" fill="none" stroke="#334155" stroke-width="10"/>
  <circle cx="800" cy="398" r="52" fill="none" stroke="#cbd5e1" stroke-width="10"/>
  <text x="230" y="500" text-anchor="middle" font-size="11" fill="#334155" font-weight="600">rear (driven)</text>
  <text x="800" y="500" text-anchor="middle" font-size="11" fill="#94a3b8">front</text>

  <!-- wheelbase -->
  <line x1="230" y1="475" x2="800" y2="475" stroke="#94a3b8" stroke-width="1" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="515" y="470" text-anchor="middle" font-size="10.5" fill="#64748b">wheelbase</text>

  <!-- CG -->
  <line x1="560" y1="285" x2="560" y2="450" stroke="#b45309" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="395" y1="285" x2="640" y2="285" stroke="#b45309" stroke-width="1" stroke-dasharray="4 4"/>
  <circle cx="560" cy="285" r="7" fill="#b45309"/>
  <text x="575" y="282" font-size="11.5" fill="#b45309" font-weight="700">CG</text>
  <text x="408" y="280" font-size="10" fill="#b45309">CG height h</text>

  <!-- suspension links projecting to SVIC -->
  <line x1="262" y1="372" x2="478" y2="356" stroke="#94a3b8" stroke-width="2"/>
  <line x1="262" y1="424" x2="478" y2="356" stroke="#94a3b8" stroke-width="2"/>
  <text x="300" y="352" font-size="9.5" fill="#94a3b8">upper link proj.</text>
  <text x="300" y="446" font-size="9.5" fill="#94a3b8">lower link proj.</text>

  <!-- SVIC -->
  <circle cx="478" cy="356" r="6" fill="#1d4ed8"/>
  <text x="486" y="350" font-size="10.5" fill="#1d4ed8" font-weight="700">side-view instant centre</text>
  <text x="486" y="364" font-size="9.5" fill="#1d4ed8">(set by the link angles)</text>

  <!-- anti-squat line: contact patch -> SVIC -> extended -->
  <line x1="230" y1="450" x2="690" y2="420" stroke="#dc2626" stroke-width="2.6" stroke-dasharray="2 0"/>
  <text x="300" y="438" font-size="10.5" fill="#dc2626" font-weight="700" transform="rotate(-3.7 300 438)">anti-squat line (contact patch → IC)</text>

  <!-- drive thrust -->
  <line x1="230" y1="450" x2="335" y2="450" stroke="#15803d" stroke-width="3" marker-end="url(#arG)"/>
  <text x="285" y="467" text-anchor="middle" font-size="10.5" fill="#15803d" font-weight="700">drive thrust</text>

  <!-- spring at rear -->
  <path d="M230,346 l0,-8 l10,-4 l-20,-8 l20,-8 l-20,-8 l10,-4 l0,-6" fill="none" stroke="#64748b" stroke-width="1.6"/>

  <!-- squat arrow -->
  <path d="M620,150 q70,30 70,90" fill="none" stroke="#7c2d12" stroke-width="2" marker-end="url(#ar)"/>
  <text x="700" y="150" font-size="10.5" fill="#7c2d12" font-weight="600">squat (pitch)</text>

  <!-- KEY correction box -->
  <rect x="60" y="92" width="372" height="62" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="74" y="112" font-size="11.5" font-weight="700" fill="#991b1b">The myth-buster:</text>
  <text x="74" y="130" font-size="11" fill="#7f1d1d">Rear tyre vertical load under power = (CG height × accel) ÷ wheelbase.</text>
  <text x="74" y="146" font-size="11" fill="#7f1d1d"><tspan font-weight="700">Anti-squat does NOT change that load</tspan> — only spring split &amp; pitch.</text>

  <!-- what anti-squat does box -->
  <rect x="525" y="486" width="380" height="58" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="538" y="506" font-size="11" fill="#1e3a8a"><tspan font-weight="700">Steeper/higher IC</tspan> = more anti-squat → resists squat, can</text>
  <text x="538" y="522" font-size="11" fill="#1e3a8a">jack &amp; UNLOAD. <tspan font-weight="700">Flatter</tspan> = squats. Drift wants MODERATE:</text>
  <text x="538" y="538" font-size="11" fill="#1e3a8a">controls pitch, keeps camber/toe consistent = steady bite.</text>
</svg>
