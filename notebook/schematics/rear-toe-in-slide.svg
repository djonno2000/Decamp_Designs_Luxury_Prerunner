<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="tv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="tg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker>
    <marker id="tge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="1000" height="660" fill="#f7f8fa"/>
  <text x="500" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Rear toe-in in a slide — why the loaded tyre drives you out (top view)</text>
  <text x="500" y="52" text-anchor="middle" font-size="12.5" fill="#64748b">left-hand corner . car sideways, travelling up the page . schematic</text>
  <line x1="398" y1="250" x2="398" y2="118" stroke="#475569" stroke-width="2.6" marker-end="url(#tv)"/>
  <text x="398" y="106" text-anchor="middle" font-size="12" fill="#475569" font-weight="700">direction of travel</text>
  <line x1="400" y1="282" x2="350" y2="196" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#tge)"/>
  <text x="286" y="192" font-size="10.5" fill="#94a3b8">car heading (nose)</text>
  <path d="M398,230 A38,38 0 0,0 370,219" fill="none" stroke="#b45309" stroke-width="1.8"/>
  <text x="320" y="248" font-size="11" fill="#b45309" font-weight="700">slip angle</text>
  <g transform="translate(440 352) rotate(-30)">
    <rect x="-52" y="-113" width="104" height="100" rx="22" fill="#dbeafe"/>
    <rect x="-52" y="13" width="104" height="100" rx="22" fill="#fee2e2"/>
    <rect x="-52" y="-115" width="104" height="230" rx="24" fill="none" stroke="#334155" stroke-width="2.4"/>
    <line x1="-52" y1="-13" x2="52" y2="-13" stroke="#cbd5e1" stroke-width="1.4"/>
    <g transform="rotate(30 -52 -80)"><rect x="-60" y="-100" width="16" height="40" rx="4" fill="#334155"/></g>
    <g transform="rotate(30 52 -80)"><rect x="44" y="-100" width="16" height="40" rx="4" fill="#334155"/></g>
    <g transform="rotate(7 -52 80)"><rect x="-60" y="60" width="16" height="44" rx="4" fill="#475569"/></g>
    <g transform="rotate(-9 52 80)"><rect x="42" y="58" width="20" height="50" rx="4" fill="#0f172a"/></g>
    <line x1="52" y1="74" x2="30" y2="6" stroke="#15803d" stroke-width="3.6" marker-end="url(#tg)"/>
  </g>
  <text x="286" y="300" font-size="10.5" fill="#1e40af" font-weight="700">FRONT</text>
  <text x="286" y="313" font-size="9" fill="#1e40af">light on throttle</text>
  <line x1="332" y1="300" x2="378" y2="300" stroke="#93c5fd" stroke-width="1.1"/>
  <text x="470" y="486" font-size="10.5" fill="#991b1b" font-weight="700">REAR</text>
  <text x="470" y="499" font-size="9" fill="#991b1b">loaded . drives</text>
  <line x1="468" y1="478" x2="452" y2="448" stroke="#fca5a5" stroke-width="1.1"/>
  <rect x="612" y="150" width="360" height="78" rx="9" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.1"/>
  <text x="626" y="171" font-size="11.5" font-weight="700" fill="#1e3a8a">Front: countersteered (points where it's going)</text>
  <text x="626" y="188" font-size="10.5" fill="#1e40af">The body is sideways but the front wheels point up the</text>
  <text x="626" y="203" font-size="10.5" fill="#1e40af">track - and they unload on throttle, so big angle</text>
  <text x="626" y="218" font-size="10.5" fill="#1e40af">stays catchable (no sudden hook = no spin), no scrub needed.</text>
  <line x1="612" y1="200" x2="455" y2="240" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="612" y="360" width="360" height="82" rx="9" fill="#f0fdf4" stroke="#86efac" stroke-width="1.1"/>
  <text x="626" y="381" font-size="11.5" font-weight="700" fill="#14532d">Rear toe-in: the loaded outer rear points</text>
  <text x="626" y="397" font-size="10.5" fill="#166534">slightly into the corner, so its big tractive force drives</text>
  <text x="626" y="412" font-size="10.5" fill="#166534">the car forward + around and gently pulls the tail</text>
  <text x="626" y="427" font-size="10.5" fill="#166534">back = drive-out + a stable, catchable slide.</text>
  <line x1="612" y1="404" x2="528" y2="400" stroke="#86efac" stroke-width="1.2"/>
  <rect x="612" y="460" width="360" height="60" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.1"/>
  <text x="626" y="481" font-size="11" font-weight="700" fill="#334155">Independent (IRS) - not linked:</text>
  <text x="626" y="498" font-size="10.5" fill="#475569">the loaded outer rear squats more, so it toes in</text>
  <text x="626" y="513" font-size="10.5" fill="#475569">more on its own - the right tyre gets the most bite.</text>
  <text x="120" y="486" font-size="11" font-weight="700" fill="#334155">tyre load (circle = load):</text>
  <circle cx="135" cy="516" r="14" fill="#0f172a"/><text x="135" y="544" text-anchor="middle" font-size="9" fill="#475569">outer rear</text>
  <circle cx="222" cy="519" r="10" fill="#475569"/><text x="222" y="544" text-anchor="middle" font-size="9" fill="#475569">inner rear</text>
  <circle cx="302" cy="522" r="6" fill="#94a3b8"/><text x="302" y="544" text-anchor="middle" font-size="9" fill="#475569">fronts</text>
  <rect x="40" y="576" width="920" height="62" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2"/>
  <text x="500" y="598" text-anchor="middle" font-size="12" fill="#9a3412" font-weight="600">Don't add instability and correct for it - build the rear to WANT to grip and drive (rear bias . even loading . toe-in . 2-way diff)</text>
  <text x="500" y="616" text-anchor="middle" font-size="12" fill="#9a3412" font-weight="600">and let the front give up grip progressively, on-throttle. Soft rear roll (not a stiff rear bar) = both rears evenly loaded = max grip.</text>
  <text x="500" y="631" text-anchor="middle" font-size="10.5" fill="#7c2d12" font-style="italic">Front-scrub then becomes a fine-tune at full lock (Acostal/Stuart), not the main event.</text>
</svg>
