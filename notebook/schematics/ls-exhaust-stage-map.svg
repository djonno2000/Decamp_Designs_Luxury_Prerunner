<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a929b"/></marker>
  </defs>
  <rect width="1000" height="640" fill="#0f1012"/>
  <text x="500" y="34" text-anchor="middle" font-size="18.5" font-weight="700" fill="#edece6">Blown LS exhaust — stage map: megaphone collectors → low merge → silencer</text>
  <text x="500" y="55" text-anchor="middle" font-size="12" fill="#7b7d84">engine → exit · the megaphones shape the sound; the MERGE does the evening</text>

  <!-- ===== BANK 1 (top) ===== -->
  <g stroke="#8a929b" stroke-width="2.4" fill="none">
    <line x1="70" y1="108" x2="250" y2="150"/><line x1="70" y1="134" x2="250" y2="150"/>
    <line x1="70" y1="160" x2="250" y2="150"/><line x1="70" y1="186" x2="250" y2="150"/>
  </g>
  <g font-size="11" font-weight="700" fill="#cda24e" text-anchor="end">
    <text x="64" y="112">1</text><text x="64" y="138">3</text><text x="64" y="164">5</text><text x="64" y="190">7</text>
  </g>
  <text x="60" y="92" font-size="9.5" fill="#7b7d84">BANK 1</text>
  <polygon points="250,136 344,124 344,176 250,164" fill="#cda24e" fill-opacity="0.22" stroke="#cda24e" stroke-width="1.8"/>

  <!-- ===== BANK 2 (bottom) ===== -->
  <g stroke="#8a929b" stroke-width="2.4" fill="none">
    <line x1="70" y1="408" x2="250" y2="450"/><line x1="70" y1="434" x2="250" y2="450"/>
    <line x1="70" y1="460" x2="250" y2="450"/><line x1="70" y1="486" x2="250" y2="450"/>
  </g>
  <g font-size="11" font-weight="700" fill="#cda24e" text-anchor="end">
    <text x="64" y="412">2</text><text x="64" y="438">4</text><text x="64" y="464">6</text><text x="64" y="490">8</text>
  </g>
  <text x="60" y="392" font-size="9.5" fill="#7b7d84">BANK 2</text>
  <polygon points="250,436 344,424 344,476 250,464" fill="#cda24e" fill-opacity="0.22" stroke="#cda24e" stroke-width="1.8"/>

  <!-- bank pipes routing to merge -->
  <path d="M344,150 C 446,150 466,282 560,280" fill="none" stroke="#8a929b" stroke-width="6" stroke-linecap="round"/>
  <path d="M344,450 C 446,450 466,300 560,302" fill="none" stroke="#8a929b" stroke-width="6" stroke-linecap="round"/>

  <!-- merge (green = the evening stage) -->
  <polygon points="558,272 558,310 622,296 622,286" fill="#5f9e74" fill-opacity="0.30" stroke="#6cc08a" stroke-width="1.8"/>
  <line x1="620" y1="291" x2="676" y2="291" stroke="#8a929b" stroke-width="6" stroke-linecap="round"/>

  <!-- final expansion cone -->
  <polygon points="676,279 760,270 760,312 676,303" fill="#cda24e" fill-opacity="0.18" stroke="#cda24e" stroke-width="1.6"/>

  <!-- straight-through silencer -->
  <rect x="760" y="268" width="132" height="46" rx="14" fill="#17181c" stroke="#cda24e" stroke-width="1.6"/>
  <g fill="#5f6166"><circle cx="780" cy="291" r="1.6"/><circle cx="796" cy="283" r="1.6"/><circle cx="796" cy="299" r="1.6"/><circle cx="814" cy="291" r="1.6"/><circle cx="830" cy="283" r="1.6"/><circle cx="830" cy="299" r="1.6"/><circle cx="848" cy="291" r="1.6"/><circle cx="864" cy="283" r="1.6"/><circle cx="864" cy="299" r="1.6"/><circle cx="880" cy="291" r="1.6"/></g>
  <text x="826" y="333" text-anchor="middle" font-size="9" fill="#7b7d84">straight-through silencer</text>

  <!-- exit -->
  <line x1="892" y1="291" x2="958" y2="291" stroke="#8a929b" stroke-width="6" stroke-linecap="round" marker-end="url(#ar)"/>
  <text x="940" y="278" text-anchor="middle" font-size="9.5" fill="#edece6">exit</text>

  <!-- ===== callouts ===== -->
  <rect x="372" y="92" width="320" height="74" rx="9" fill="#17181c" stroke="#cda24e" stroke-width="1.1"/>
  <text x="386" y="112" font-size="11.5" font-weight="700" fill="#cda24e">Tapered 4→1 megaphone collector (×2)</text>
  <text x="386" y="129" font-size="10.5" fill="#cfcec8">Blends each bank's 4 pulses + opens the sound.</text>
  <text x="386" y="144" font-size="10.5" fill="#cfcec8">Mild scavenge tune (weak on a blower) — this is the</text>
  <text x="386" y="159" font-size="10.5" fill="#cfcec8"><tspan font-weight="700">one tuned stage</tspan>. Don't stack three.</text>
  <line x1="372" y1="140" x2="344" y2="150" stroke="#cda24e" stroke-width="1"/>

  <text x="220" y="250" font-size="9.5" fill="#7b7d84" font-style="italic">blower owns the top →</text>
  <text x="220" y="263" font-size="9.5" fill="#7b7d84" font-style="italic">collectors drop down &amp; out</text>

  <rect x="372" y="360" width="338" height="74" rx="9" fill="#17181c" stroke="#6cc08a" stroke-width="1.1"/>
  <text x="386" y="380" font-size="11.5" font-weight="700" fill="#6cc08a">2-into-1 merge (low) — the EVENING stage</text>
  <text x="386" y="397" font-size="10.5" fill="#cfcec8">Recombines the two 90°-offset banks toward the</text>
  <text x="386" y="412" font-size="10.5" fill="#cfcec8">even 90° whole-engine train = smoother, more even.</text>
  <text x="386" y="427" font-size="10.5" fill="#cfcec8">(X-pipe here instead if you keep dual exits.)</text>
  <line x1="592" y1="378" x2="600" y2="292" stroke="#6cc08a" stroke-width="1"/>

  <rect x="638" y="360" width="334" height="74" rx="9" fill="#17181c" stroke="#cda24e" stroke-width="1.1"/>
  <text x="652" y="380" font-size="11.5" font-weight="700" fill="#cda24e">Mild expansion + straight-through silencer</text>
  <text x="652" y="397" font-size="10.5" fill="#cfcec8">Final open character, tames dB + drone so it passes</text>
  <text x="652" y="412" font-size="10.5" fill="#cfcec8">tech + survives the road drive. A gentle stage —</text>
  <text x="652" y="427" font-size="10.5" fill="#cfcec8"><tspan font-weight="700">not</tspan> a second hard tune. (reverse-cone option.)</text>
  <line x1="805" y1="360" x2="820" y2="316" stroke="#cda24e" stroke-width="1"/>

  <!-- caveat strip -->
  <rect x="40" y="556" width="920" height="62" rx="8" fill="#17181c" stroke="#cda24e" stroke-width="1.1"/>
  <text x="500" y="578" text-anchor="middle" font-size="12" fill="#edece6" font-weight="600">Blown engine: this is ~90% SOUND + flow, not a power tune — the blower forces cylinder filling, so tuned scavenging matters little.</text>
  <text x="500" y="596" text-anchor="middle" font-size="12" fill="#edece6" font-weight="600">Megaphones shape the sound &amp; smooth the waveform; the MERGES do the evening. Mind dB limits &amp; heat near the blower and cab.</text>
  <text x="500" y="611" text-anchor="middle" font-size="10.5" fill="#7b7d84" font-style="italic">Ballpark: ~1⅞″ equal-length primaries (~30–32″) · gentle 5–8° collector taper · ~3–3½″ merge &amp; tailpipe — finalise with a header calc to your power/RPM.</text>
</svg>
