<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="'Segoe UI', system-ui, sans-serif">
  <rect width="1000" height="600" fill="#0f1012"/>
  <text x="500" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#edece6">LS firing pulses — why a cross-plane V8 burbles, and how the "scream" is made</text>
  <text x="500" y="55" text-anchor="middle" font-size="12.5" fill="#7b7d84">firing order 1-8-7-2-6-5-4-3 · one cylinder every 90° of crank · pulse timing over one 720° cycle</text>

  <!-- gridlines every 90 deg, x = 220 + deg -->
  <g stroke="#2a2c30" stroke-width="1">
    <line x1="220" y1="80" x2="220" y2="500"/><line x1="310" y1="80" x2="310" y2="500"/>
    <line x1="400" y1="80" x2="400" y2="500"/><line x1="490" y1="80" x2="490" y2="500"/>
    <line x1="580" y1="80" x2="580" y2="500"/><line x1="670" y1="80" x2="670" y2="500"/>
    <line x1="760" y1="80" x2="760" y2="500"/><line x1="850" y1="80" x2="850" y2="500"/>
    <line x1="940" y1="80" x2="940" y2="500"/>
  </g>
  <g font-size="9.5" fill="#5f6166" text-anchor="middle">
    <text x="220" y="494">0°</text><text x="310" y="494">90</text><text x="400" y="494">180</text><text x="490" y="494">270</text>
    <text x="580" y="494">360</text><text x="670" y="494">450</text><text x="760" y="494">540</text><text x="850" y="494">630</text><text x="940" y="494">720</text>
  </g>

  <!-- ROW: whole engine (even 90) -->
  <text x="205" y="106" text-anchor="end" font-size="11.5" font-weight="700" fill="#cda24e">WHOLE ENGINE</text>
  <text x="205" y="120" text-anchor="end" font-size="9" fill="#7b7d84">every 90° — EVEN</text>
  <line x1="220" y1="128" x2="940" y2="128" stroke="#3a3c40" stroke-width="1"/>
  <g fill="#cda24e">
    <rect x="216" y="113" width="8" height="30" rx="2"/><rect x="306" y="113" width="8" height="30" rx="2"/>
    <rect x="396" y="113" width="8" height="30" rx="2"/><rect x="486" y="113" width="8" height="30" rx="2"/>
    <rect x="576" y="113" width="8" height="30" rx="2"/><rect x="666" y="113" width="8" height="30" rx="2"/>
    <rect x="756" y="113" width="8" height="30" rx="2"/><rect x="846" y="113" width="8" height="30" rx="2"/>
  </g>
  <g font-size="11" font-weight="700" fill="#0f1012" text-anchor="middle">
    <text x="220" y="135">1</text><text x="310" y="135">8</text><text x="400" y="135">7</text><text x="490" y="135">2</text>
    <text x="580" y="135">6</text><text x="670" y="135">5</text><text x="760" y="135">4</text><text x="850" y="135">3</text>
  </g>

  <!-- ROW: bank 1 (uneven) -->
  <text x="205" y="196" text-anchor="end" font-size="11.5" font-weight="700" fill="#a9b0b8">BANK 1</text>
  <text x="205" y="210" text-anchor="end" font-size="9" fill="#7b7d84">1·3·5·7 — uneven</text>
  <line x1="220" y1="218" x2="940" y2="218" stroke="#3a3c40" stroke-width="1"/>
  <g fill="#8a929b">
    <rect x="216" y="203" width="8" height="30" rx="2"/><rect x="396" y="203" width="8" height="30" rx="2"/>
    <rect x="666" y="203" width="8" height="30" rx="2"/><rect x="846" y="203" width="8" height="30" rx="2"/>
  </g>
  <g font-size="11" font-weight="700" fill="#edece6" text-anchor="middle">
    <text x="220" y="225">1</text><text x="400" y="225">7</text><text x="670" y="225">5</text><text x="850" y="225">3</text>
  </g>
  <g font-size="9" fill="#7b7d84" text-anchor="middle">
    <text x="310" y="248">180°</text><text x="535" y="248">270°</text><text x="760" y="248">180°</text>
  </g>
  <text x="895" y="248" text-anchor="middle" font-size="9" font-weight="700" fill="#d8593f">90°→</text>

  <!-- ROW: bank 2 (uneven) -->
  <text x="205" y="286" text-anchor="end" font-size="11.5" font-weight="700" fill="#a9b0b8">BANK 2</text>
  <text x="205" y="300" text-anchor="end" font-size="9" fill="#7b7d84">2·4·6·8 — uneven</text>
  <line x1="220" y1="308" x2="940" y2="308" stroke="#3a3c40" stroke-width="1"/>
  <g fill="#8a929b">
    <rect x="306" y="293" width="8" height="30" rx="2"/><rect x="486" y="293" width="8" height="30" rx="2"/>
    <rect x="576" y="293" width="8" height="30" rx="2"/><rect x="756" y="293" width="8" height="30" rx="2"/>
  </g>
  <g font-size="11" font-weight="700" fill="#edece6" text-anchor="middle">
    <text x="310" y="315">8</text><text x="490" y="315">2</text><text x="580" y="315">6</text><text x="760" y="315">4</text>
  </g>
  <g font-size="9" fill="#7b7d84" text-anchor="middle">
    <text x="400" y="338">180°</text><text x="670" y="338">180°</text>
  </g>
  <text x="535" y="338" text-anchor="middle" font-size="9" font-weight="700" fill="#d8593f">90°</text>
  <text x="850" y="338" text-anchor="middle" font-size="9" fill="#7b7d84">270°</text>

  <!-- ROW: collector A (even) -->
  <text x="205" y="386" text-anchor="end" font-size="11.5" font-weight="700" fill="#6cc08a">COLLECTOR A</text>
  <text x="205" y="400" text-anchor="end" font-size="9" fill="#7b7d84">{1,4,6,7} — EVEN</text>
  <line x1="220" y1="408" x2="940" y2="408" stroke="#3a3c40" stroke-width="1"/>
  <g fill="#5f9e74">
    <rect x="216" y="393" width="8" height="30" rx="2"/><rect x="396" y="393" width="8" height="30" rx="2"/>
    <rect x="576" y="393" width="8" height="30" rx="2"/><rect x="756" y="393" width="8" height="30" rx="2"/>
  </g>
  <g font-size="11" font-weight="700" fill="#0f1012" text-anchor="middle">
    <text x="220" y="415">1</text><text x="400" y="415">7</text><text x="580" y="415">6</text><text x="760" y="415">4</text>
  </g>
  <g font-size="9" fill="#6cc08a" text-anchor="middle">
    <text x="310" y="438">180°</text><text x="490" y="438">180°</text><text x="670" y="438">180°</text>
  </g>

  <!-- ROW: collector B (even) -->
  <text x="205" y="466" text-anchor="end" font-size="11.5" font-weight="700" fill="#6cc08a">COLLECTOR B</text>
  <text x="205" y="480" text-anchor="end" font-size="9" fill="#7b7d84">{2,3,5,8} — EVEN</text>
  <line x1="220" y1="475" x2="940" y2="475" stroke="#3a3c40" stroke-width="1"/>
  <g fill="#5f9e74">
    <rect x="306" y="460" width="8" height="30" rx="2"/><rect x="486" y="460" width="8" height="30" rx="2"/>
    <rect x="666" y="460" width="8" height="30" rx="2"/><rect x="846" y="460" width="8" height="30" rx="2"/>
  </g>
  <g font-size="11" font-weight="700" fill="#0f1012" text-anchor="middle">
    <text x="310" y="482">8</text><text x="490" y="482">2</text><text x="670" y="482">5</text><text x="850" y="482">3</text>
  </g>

  <!-- takeaway -->
  <rect x="40" y="520" width="920" height="62" rx="8" fill="#17181c" stroke="#cda24e" stroke-width="1.1"/>
  <text x="500" y="542" text-anchor="middle" font-size="12.5" fill="#edece6" font-weight="600">Each bank on its own is uneven (note the tight 90° pair = the burble). Regroup ACROSS the banks into {1,4,6,7} and {2,3,5,8}</text>
  <text x="500" y="560" text-anchor="middle" font-size="12.5" fill="#edece6" font-weight="600">and every collector gets an even 180° pulse train = the scream. That cross-bank regrouping is exactly what the "bundle of snakes" does.</text>
  <text x="500" y="575" text-anchor="middle" font-size="10.5" fill="#7b7d84" font-style="italic">A flat-plane crank makes each bank even on its own (no crossover). A full 8-into-1 = the top row, even every 90° = highest-pitched scream.</text>
</svg>
