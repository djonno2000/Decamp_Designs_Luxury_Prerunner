<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
  </defs>
  <rect width="960" height="520" fill="#f7f8fa"/>
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Dynamic toe &amp; camber under squat — designed-in slide bite</text>
  <text x="480" y="52" text-anchor="middle" font-size="12.5" fill="#64748b">what the rear tyre does when you get on the power and it squats</text>

  <!-- divider -->
  <line x1="480" y1="80" x2="480" y2="470" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- ================= PANEL A: REAR VIEW (camber) ================= -->
  <text x="240" y="100" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b">Rear view — keep the loaded tyre FLAT</text>
  <line x1="80" y1="380" x2="430" y2="380" stroke="#cbd5e1" stroke-width="2"/>
  <text x="255" y="398" text-anchor="middle" font-size="10" fill="#94a3b8">road</text>

  <!-- static tyre (positive camber, top leans out/left) -->
  <g transform="rotate(-9 175 320)">
    <rect x="158" y="250" width="34" height="130" rx="4" fill="none" stroke="#94a3b8" stroke-width="3"/>
  </g>
  <rect x="150" y="375" width="12" height="8" fill="#cbd5e1"/>
  <text x="175" y="235" text-anchor="middle" font-size="10.5" fill="#64748b" font-weight="600">STATIC</text>
  <text x="175" y="423" text-anchor="middle" font-size="9.5" fill="#94a3b8">slight + camber</text>
  <text x="175" y="436" text-anchor="middle" font-size="9.5" fill="#94a3b8">(top leans out)</text>
  <text x="175" y="449" text-anchor="middle" font-size="9.5" fill="#94a3b8">small patch</text>

  <!-- loaded/squatted tyre (flat) -->
  <rect x="330" y="250" width="36" height="130" rx="4" fill="none" stroke="#15803d" stroke-width="3.4"/>
  <rect x="326" y="375" width="44" height="9" fill="#15803d"/>
  <text x="348" y="235" text-anchor="middle" font-size="10.5" fill="#15803d" font-weight="700">LOADED / SQUAT</text>
  <text x="348" y="423" text-anchor="middle" font-size="9.5" fill="#15803d">flat → full-width</text>
  <text x="348" y="436" text-anchor="middle" font-size="9.5" fill="#15803d">contact patch</text>

  <!-- transition arrow -->
  <line x1="225" y1="300" x2="300" y2="300" stroke="#15803d" stroke-width="2.4" marker-end="url(#a2)"/>
  <text x="262" y="293" text-anchor="middle" font-size="10" fill="#15803d" font-weight="600">+power → squat</text>

  <text x="240" y="455" text-anchor="middle" font-size="0" fill="#000"></text>

  <!-- ================= PANEL B: TOP VIEW (toe) ================= -->
  <text x="720" y="100" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b">Top view — rear toes IN more under squat</text>
  <text x="720" y="118" text-anchor="middle" font-size="10.5" fill="#64748b">direction of travel ↑</text>

  <!-- car centreline -->
  <line x1="720" y1="135" x2="720" y2="430" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="720" y="448" text-anchor="middle" font-size="9.5" fill="#94a3b8">car centreline</text>

  <!-- LEFT rear wheel: static toe-in (solid) + squat toe-in (dashed, more) -->
  <!-- static -->
  <g transform="rotate(4 610 280)">
    <rect x="598" y="220" width="24" height="120" rx="4" fill="none" stroke="#334155" stroke-width="3"/>
  </g>
  <!-- squat (more toe-in) -->
  <g transform="rotate(9 610 280)">
    <rect x="598" y="220" width="24" height="120" rx="4" fill="none" stroke="#15803d" stroke-width="2.6" stroke-dasharray="5 4"/>
  </g>
  <!-- toe link -->
  <line x1="622" y1="330" x2="700" y2="345" stroke="#64748b" stroke-width="2"/>
  <text x="660" y="362" text-anchor="middle" font-size="9" fill="#64748b">toe link</text>

  <!-- RIGHT rear wheel -->
  <g transform="rotate(-4 830 280)">
    <rect x="818" y="220" width="24" height="120" rx="4" fill="none" stroke="#334155" stroke-width="3"/>
  </g>
  <g transform="rotate(-9 830 280)">
    <rect x="818" y="220" width="24" height="120" rx="4" fill="none" stroke="#15803d" stroke-width="2.6" stroke-dasharray="5 4"/>
  </g>
  <line x1="818" y1="330" x2="740" y2="345" stroke="#64748b" stroke-width="2"/>

  <!-- toe-in arrows at leading edges -->
  <line x1="640" y1="210" x2="662" y2="216" stroke="#15803d" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="800" y1="210" x2="778" y2="216" stroke="#15803d" stroke-width="2" marker-end="url(#a2)"/>

  <!-- legend for panel B -->
  <g font-size="10">
    <line x1="600" y1="392" x2="626" y2="392" stroke="#334155" stroke-width="3"/>
    <text x="632" y="396" fill="#334155">static toe-in (0.5–2 mm/wheel)</text>
    <line x1="600" y1="410" x2="626" y2="410" stroke="#15803d" stroke-width="2.6" stroke-dasharray="5 4"/>
    <text x="632" y="414" fill="#15803d">under squat: toes in MORE</text>
  </g>

  <!-- bottom note -->
  <rect x="40" y="476" width="880" height="38" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="480" y="494" text-anchor="middle" font-size="11.5" fill="#14532d" font-weight="600">Toe-in under squat = stability + forward bite on power. Engineer it GEOMETRICALLY (rigid toe link) — not via soft bushings (vague).</text>
  <text x="480" y="509" text-anchor="middle" font-size="10.5" fill="#166534">Keep it modest: too much toe swinging through travel makes transitions twitchy.</text>
</svg>
