<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f1012">
<title>MCD Masterclass · Shed Companion</title>
<!-- Vendored Barlow for offline/PWA fidelity (app already declared Barlow; previously fell back to system fonts) -->
<link href="assets/fonts/fonts.css" rel="stylesheet">
<style>
:root{
  --night:#0f1012; --panel:#17181c; --panel2:#20232a; --line:#363a42;
  --dust:#bdbcb3; --bone:#edece6; --gold:#cda24e; --flag:#d56a39;
  --ok:#94ad6b; --mute:#7b7d84; --red:#d2503f; --sketch:#3f86f0;
  --brass:rgba(205,162,78,.14);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; height:100%}
body{
  background:var(--night); color:var(--bone);
  font-family:'Barlow','Segoe UI',system-ui,sans-serif;
  display:flex; flex-direction:column; min-height:100dvh; overflow:hidden;
}
.cap{font-family:'Barlow Condensed','Barlow',sans-serif; letter-spacing:.04em}
header{
  padding:10px 16px 8px; border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:10px; flex:0 0 auto;
}
header .dot{width:11px;height:11px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold)}
header h1{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;margin:0;letter-spacing:.06em;text-transform:uppercase}
header .sub{font-size:11.5px;color:var(--mute);margin-top:1px}
#status{margin-left:auto;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:13px;
  padding:5px 12px;border-radius:999px;border:1px solid var(--line);color:var(--mute);white-space:nowrap;letter-spacing:.05em}
#status.listen{color:var(--gold);border-color:var(--gold);background:var(--brass);animation:pulse 1.1s ease-in-out infinite}
#status.think{color:var(--sketch);border-color:var(--sketch)}
#status.speak{color:var(--ok);border-color:var(--ok)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

main{flex:1 1 auto; overflow-y:auto; padding:16px; display:flex; flex-direction:column}
#kind{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:14px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--gold);margin-bottom:8px;min-height:18px}
#kind .flag{font-size:11px;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:1px 6px;margin-left:8px;letter-spacing:.06em}
#title{font-size:25px;line-height:1.28;font-weight:600;margin:0 0 14px;color:var(--bone)}
#quote{border-left:3px solid var(--gold);padding:9px 0 9px 14px;margin:0 0 14px;
  font-size:18px;line-height:1.4;color:var(--dust);font-style:italic;display:none}
#quote.show{display:block}
.meta{font-size:15px;line-height:1.45;color:var(--mute);margin:0 0 9px}
.meta b{color:var(--dust);font-weight:600}
.meta.hide{display:none}
#src{font-size:12.5px;color:var(--mute);margin-top:auto;padding-top:12px;letter-spacing:.02em}

#ask-echo{font-size:13px;color:var(--gold);margin-bottom:10px;min-height:0;letter-spacing:.02em;display:none}
#ask-echo.show{display:block}

footer{flex:0 0 auto; border-top:1px solid var(--line); padding:12px 14px calc(12px + env(safe-area-inset-bottom)); background:var(--panel)}
.row{display:flex; gap:10px; margin-bottom:10px}
.row:last-child{margin-bottom:0}
button{font-family:'Barlow Condensed',sans-serif; font-weight:600; letter-spacing:.05em;
  background:var(--panel2); color:var(--bone); border:1px solid var(--line); border-radius:13px;
  cursor:pointer; transition:.12s; -webkit-user-select:none; user-select:none; touch-action:manipulation}
button:active{transform:scale(.97)}
button:disabled{opacity:.4}
.transport{flex:1; height:62px; font-size:17px; display:flex; align-items:center; justify-content:center; gap:8px}
.transport.play{flex:1.5; background:var(--brass); border-color:var(--gold); color:var(--gold); font-size:19px}
.transport .ic{font-size:22px;line-height:1}
#ask{width:100%; height:84px; font-size:24px; border-radius:16px;
  background:linear-gradient(180deg,#2a2d34,#20232a); border:1.5px solid var(--gold); color:var(--gold);
  display:flex; align-items:center; justify-content:center; gap:12px; text-transform:uppercase; letter-spacing:.08em}
#ask .ic{font-size:30px}
#ask.live{background:var(--brass); border-color:var(--gold); animation:pulse 1.1s ease-in-out infinite}
.mini{flex:1; height:48px; font-size:14px; background:transparent; color:var(--mute); border-color:var(--line)}
.mini.on{color:var(--gold); border-color:var(--gold); background:var(--brass)}
.mini .ic{font-size:16px;margin-right:5px}

#sheet{position:fixed; inset:0; background:rgba(8,9,11,.86); backdrop-filter:blur(3px); z-index:40;
  display:none; flex-direction:column; padding:14px}
#sheet.open{display:flex}
#sheet h2{font-family:'Barlow Condensed',sans-serif;font-size:19px;letter-spacing:.06em;text-transform:uppercase;margin:6px 4px 12px;display:flex;align-items:center}
#sheet h2 button{margin-left:auto;height:40px;width:40px;font-size:20px;border-radius:10px}
#chapters{flex:1; overflow-y:auto}
.chap{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin:14px 6px 7px}
.jump{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:11px;
  padding:14px 14px;margin-bottom:7px;font-size:16px;color:var(--bone);font-family:'Barlow',sans-serif;font-weight:500;line-height:1.3}
.jump small{display:block;color:var(--mute);font-size:12.5px;margin-top:3px;font-weight:400}

#txtwrap{display:none; gap:8px; margin-top:4px}
#txtwrap.show{display:flex}
#txt{flex:1;height:48px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;color:var(--bone);
  padding:0 14px;font-family:'Barlow',sans-serif;font-size:16px}
#note{font-size:11.5px;color:var(--mute);text-align:center;margin-top:9px;line-height:1.4}
select{background:var(--panel2);color:var(--dust);border:1px solid var(--line);border-radius:9px;height:34px;font-family:'Barlow Condensed',sans-serif;font-size:13px;padding:0 8px;flex:1}
/* research section: clearly distinct from Morgan's gold */
#kind .flag.rsch{color:var(--sketch);border-color:var(--sketch);background:rgba(63,134,240,.12)}
.grphdr{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;letter-spacing:.04em;color:var(--bone);
  background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:13px 14px;margin:8px 0 9px;cursor:pointer;display:flex;align-items:center;gap:8px}
.grphdr .arw{font-size:12px;color:var(--mute);width:12px}
.grphdr small{color:var(--mute);font-weight:400;font-size:12px;margin-left:5px}
.grphdr.rsch{color:var(--sketch);border-color:rgba(63,134,240,.5);background:rgba(63,134,240,.08)}
.grpbody{margin-bottom:6px}
</style>
</head>
<body>
<header>
  <span class="dot"></span>
  <div>
    <h1>MCD Masterclass</h1>
    <div class="sub" id="subline">Shed companion · 84 teachings</div>
  </div>
  <div id="status">Ready</div>
</header>

<main>
  <div id="ask-echo"></div>
  <div id="kind">Welcome</div>
  <h2 id="title">Morgan Clarke Design — Fabrication Masterclass</h2>
  <blockquote id="quote"></blockquote>
  <p class="meta" id="why"></p>
  <p class="meta" id="avoids"></p>
  <div id="src"></div>
</main>

<footer>
  <div class="row">
    <button class="transport" id="prev" aria-label="Previous"><span class="ic">⏮</span></button>
    <button class="transport play" id="play"><span class="ic">▶</span><span id="playlbl">Play</span></button>
    <button class="transport" id="next" aria-label="Next"><span class="ic">⏭</span></button>
  </div>
  <div class="row">
    <button id="ask"><span class="ic">🎙</span> Ask Morgan</button>
  </div>
  <div id="txtwrap">
    <input id="txt" placeholder="Type a question…" enterkeyhint="search">
    <button class="transport" id="txtgo" style="flex:0 0 64px;height:48px">Ask</button>
  </div>
  <div class="row">
    <button class="mini" id="hf"><span class="ic">♾</span>Hands-free</button>
    <button class="mini" id="slow"><span class="ic">−</span>Slower</button>
    <button class="mini" id="fast">Faster<span class="ic" style="margin:0 0 0 5px">+</span></button>
    <button class="mini" id="chapbtn"><span class="ic">☰</span>Chapters</button>
  </div>
  <div id="note"></div>
</footer>

<div id="sheet">
  <h2>Jump to <button id="sheetclose">✕</button></h2>
  <div id="chapters"></div>
</div>

<script>const MC = {"principles": ["Prep is not optional. Clean to bright metal, wire wheel then acetone, before any weld — contamination becomes a defect you can't grind out later.", "Control heat with tacks. Frequent tacks act as heat sinks and stop expansion pulling a joint out of line — the cheapest distortion control there is.", "Verify on the vehicle, not the drawing. Drawings set the bold shapes; real fit comes from measuring and referencing off the actual car.", "Match the consumable to the job. ER80S-D2 for chromoly, silicon bronze for low-penetration body tacks — the rod choice is a deliberate decision, not a default.", "Plan the sequence so each step doesn't wreck the last — bead roll before cutout, tack the non-rolled section, support floppy panels before welding.", "Set yourself up to succeed: hand rests, ghost runs, fine-tip layout, cushioned clamps. Small setup habits compound into clean, repeatable work."], "stages": [{"name": "Design & Planning", "episodes": [{"title": "Dakar Prototype — 3D Printed Body Panel Mock-Up", "desc": "Unpacking, test-fitting and evaluating 3D-printed prototype body panels on the Dakar chassis — fitment, bonding and design adjustments where the physical mock-up reveals what the render hid.", "teachings": [{"text": "Accept imperfect fit on 3D-printed prototype panels and just buzz/trim minor interference to get a test fit.", "why": "Printed prototypes inherently have tolerance issues; trimming lets you assess the overall design fast without ruining parts.", "avoids": "Forcing unadjusted panels into misalignment or damage.", "quote": "we can at least just buzz some of this off", "time": "1:39", "flag": "HEARD"}, {"text": "Trust the physical mock-up over the render — plan progressive radii / shallower dish transitions where a render made a body line look steep.", "why": "Render shadowing and model differences mislead; the physical part reveals the gradual flow that actually looks right.", "avoids": "Harsh, steep body lines that don't flow as intended.", "quote": "it looked steep... sketch looks gradual", "time": "11:32", "flag": "HEARD"}, {"text": "Do a quick temporary door/quarter-panel check for clashes BEFORE drilling or committing mounts.", "why": "Catches interferences (e.g. with a window scoop) before you've made holes.", "avoids": "Discovering a clash after permanent mounts are in.", "quote": "just do a little bit of a check on it... they're not going to clash", "time": "14:04", "flag": "HEARD"}, {"text": "Use clecos for quick non-permanent panel positioning during test fit ('cleeko, plink plink').", "why": "Lets you evaluate gaps, raises and overall vibe before any permanent fastening.", "avoids": "No safe way to test positioning, risking permanent mounting errors.", "quote": "if we just cleeko, plink, plink right there", "time": "3:53", "flag": "HEARD"}, {"text": "Plan for printed-part thickness mismatch (~3/16\" thickest) with a bonding/overlay or an early-terminated return so it integrates flush.", "why": "Printed parts vary in thickness; overlay/bonding prevents stepping or protrusion after bodywork.", "avoids": "Visible steps/gaps where printed fender meets chassis panel.", "quote": "the thickest part is like 3/16", "time": "5:15", "flag": "HEARD"}, {"text": "Tack mock-up panels with CA (crazy) glue for rapid removable positioning, then clamp.", "why": "Fast, removable holding for a vibe check without drilling or committing on prototypes.", "avoids": "Unstable or scratched panels while handling for fit checks.", "quote": "I'm using crazy glue stuff right now", "time": "7:52", "flag": "HEARD"}]}, {"title": "Dakar Prototype — Digital Design", "desc": "His rough digital sketching workflow in Photoshop on a Wacom tablet for a machined crossmember/bracket — layers, brushes and fast iterations to communicate intent to the machinist and client.", "teachings": [{"text": "Start super rough in Photoshop on a photo of the actual chassis/engine area (digitally erase the engine etc.), drawing shapes fast without cleaning details.", "why": "Lets you process-of-elimination what the shape wants to be before committing; instant erase/undo beats hand sketching for warm-up iterations.", "avoids": "Wasting shop time on physical mockups that lock in a suboptimal shape.", "quote": "sketched this just in layers. It's super sloppy", "time": "7:05", "flag": "HEARD"}, {"text": "Keep a tiny set of simple pressure-sensitive brushes (brush pen, big airbrush, ballpoint, a couple of erasers) on unnamed layers — work at 'speed of a sketch'.", "why": "Primitive tools keep you fast for visual communication without overcomplicating; layers stay flexible for feedback.", "avoids": "Ambiguous design intent that gets mis-machined.", "quote": "brush pen, big airbrush, ballpoint... dumb eraser", "time": "14:26", "flag": "HEARD"}, {"text": "Rotate the canvas frequently to match your natural arm motion instead of forcing straight lines.", "why": "Your arm has one consistent motion (like on paper); working with it gives more organic flow.", "avoids": "Stiff, unnatural lines that become flat machined features.", "quote": "my arm has a motion that's consistent", "time": "25:47", "flag": "HEARD"}, {"text": "Draw only within real build/machining constraints — known plate thickness, belt serviceability, pulley clearance — not a fantasy shape.", "why": "Keeps the sketch buildable (5-axis vs hand-fab reality) and sets honest expectations with client and machinist.", "avoids": "Unbuildable features that compromise thickness/serviceability or force rework.", "quote": "I draw it only within the constraints of what I think I can do", "time": "4:15", "flag": "HEARD"}, {"text": "Give the machinist at least three different views of the same part with surface/shape lines, highlights and value shading.", "why": "Clear views give options to tune and kill the grey-area interpretations you get from verbal/hand-talk.", "avoids": "Miscommunication producing a part that doesn't integrate.", "quote": "I like to at least do three different views... show some surface lines", "time": "33:31", "flag": "HEARD"}, {"text": "'Dirty bird' sketch — reuse the colours/layers already on the sketch, minimal detail, focus on flow and cohesion not polish.", "why": "Speed and clear communication matter more than a pretty render for big-investment parts.", "avoids": "Slow, over-detailed designs that delay sending files to the machinist.", "quote": "this is just dirty bird sketching... using the colors that are already on the sketch", "time": "11:09", "flag": "HEARD"}]}]}, {"name": "TIG Welding Technique", "episodes": [{"title": "How to TIG Weld (Double Pass) — Part 1: Root Pass + Prep", "desc": "Prep, tacking and root-pass technique on a bolt-on pusher bumper for the Vivian F-100, in 1.75\" .120 wall chromoly tube to .125 plate.", "teachings": [{"text": "Run a water-cooled TIG torch from day one, not air-cooled.", "why": "Water keeps leads, argon and torch at a consistent temperature for repeatable passes; air-cooled heats up through a session and shifts your puddle as if you'd turned the amps up.", "avoids": "Weld consistency drifting over long or repetitive passes.", "quote": "you have to get a water cooled machine right off the bat", "time": "5:52", "flag": "HEARD"}, {"text": "Prep hard — wire wheel then acetone wipe every surface before welding. A minor fit gap (~6.5/10) the root can fill is fine; contamination is not.", "why": "Rust, grey discolouration and old tacks get pulled into the puddle as 'lily pads' and ruin fusion.", "avoids": "Porous, weak root passes that need cutting out.", "quote": "a simple rag and acetone on any surface before welding is going to be absolutely huge", "time": "37:48", "flag": "HEARD"}, {"text": "Tack every ~1/2 inch on fit-up joints; use extra tacks as heat sinks, especially tube-to-plate and miters.", "why": "Spreads the heat load evenly and stops expansion/contraction pulling the joint out of alignment on long welds.", "avoids": "Warp and twist during the root pass.", "quote": "I'm going to go through and I'm going to attack every half inch", "time": "43:05", "flag": "HEARD"}, {"text": "Set up wood/helper blocks for a comfortable hand rest, and do a 'ghost run' (dry torch pass) before striking the arc on important welds.", "why": "Planned movement and a steady hand prevent shake and mid-pass adjustments; the dark hood exaggerates small movements.", "avoids": "Wobbly root passes and too much filler on the cap.", "quote": "do a pre-run... just do a ghost run", "time": "31:40", "flag": "HEARD"}, {"text": "Use ER80S-D2 filler (1/16\" or .045\") for chromoly root passes, over ER70.", "why": "He prefers how the ER80 burns and it suits the heat-treated, high-stress off-road part.", "avoids": "Suboptimal fusion or properties on .120 wall chromoly under impact.", "quote": "I like how the ER 80 burns more than the ER 70", "time": "49:21", "flag": "HEARD"}, {"text": "When swapping to a bigger cup (e.g. #8 up to a #12 Fupa with screen), tighten the gas lens/handle securely BEFORE fitting the ceramic cup.", "why": "Stops the cup loosening the lens when you remove it, so you're not chasing gas leaks mid-session.", "avoids": "Interrupted workflow and inconsistent shielding gas.", "quote": "give it a quick crank and then you're not chasing the gas lines off", "time": "17:47", "flag": "HEARD"}]}, {"title": "How to TIG Weld (Double Pass) — Part 2: Final Prep + Cover Pass", "desc": "Final prep (sanding, beveling, wire wheel, DA) and the cover pass on the Vivian chromoly bumper (1.75\" .120 wall tube + .125 plate), building on the Part 1 root pass.", "teachings": [{"text": "Before the cover pass, drill RELIEF HOLES in any sealed/360°-welded tube or box section.", "why": "Heat builds pressure in a closed section and spits molten metal back at you during the cover pass.", "avoids": "Spitting/blowouts mid-pass that ruin the weld and can burn you.", "quote": "the pressure will build up in there from the Heat and it can spit back at you", "time": "2:18", "flag": "HEARD"}, {"text": "Prep the root for the cover pass by facing the top/vertical surfaces with 60 grit, then sanding a 45° bevel across the root.", "why": "Removes excess weld, surface upsets and grey/fog contamination so the cover ties everything together without lily pads trailing.", "avoids": "Contaminated cover passes with lily-pad trails weakening the junctions.", "quote": "giving a nice like diagonal sand like a bevel", "time": "8:02", "flag": "HEARD"}, {"text": "Hit all weld junctions and plate areas with a 3\" 60-grit surface-conditioning disc plus wire wheel BEFORE the DA sander.", "why": "Pulls contaminants out and freshens the surface for a consistent clean cover without doubling the HAZ haze.", "avoids": "Leftover grey contamination causing cover-pass defects.", "quote": "three inch 60 grit", "time": "3:38", "flag": "HEARD"}, {"text": "After the wire wheel, DA/orbital-sand the plate areas to 'fluff' them back to fresh metal.", "why": "Keeps surfaces looking new and limits the heat-affected zone to only the final pass — better appearance, less contamination risk.", "avoids": "Abused-looking plates with doubled HAZ haze.", "quote": "go through all the plate areas and kind of just fluff them back", "time": "9:53", "flag": "HEARD"}, {"text": "Make full surface cleaning (wire wheel + DA + acetone) a HABIT before every cover pass, even if the root looked fine.", "why": "Stops dust from prior sanding/templates contaminating the rod or weld and creating grey-fog trailing defects.", "avoids": "Porous/weak cover passes from skipped cleaning.", "quote": "a good habit is there will be sanding and like finishing done before we start the cover pass", "time": "2:29", "flag": "HEARD"}]}]}, {"name": "Suspension & Mounts", "episodes": [{"title": "Dakar Prototype — Billet Trailing Arm Jack Pads", "desc": "Making consumable billet-style jack pads (triangular .125 chromoly plates) for the Dakar prototype trailing arms — templating off the arms, transferring data, and laying out/cutting serviceable jack points that protect the machined parts.", "teachings": [{"text": "Template the jack-pad shape directly off the trailing arm — transfer hole locations and perimeter with light centre punches/scribe marks for the outer constraints.", "why": "Captures the exact standoff and hole positions for the integrated jack point without direct-measurement errors.", "avoids": "Pads that don't align with the machined standoff/holes.", "quote": "get the holes and then that's all the information", "time": "2:09", "flag": "HEARD"}, {"text": "Design the jack pad as a CONSUMABLE drilled-and-tapped triangular plate that bolts into the machined standoff — don't thread directly into the billet part.", "why": "Protects the expensive machined work from jack damage; cheap and easy to replace when it gets beat up off-road.", "avoids": "Permanent damage to billet machined surfaces.", "quote": "it's also consumable", "time": "0:52", "flag": "HEARD"}, {"text": "Transfer the data, then connect the straight points with a proper straight edge before cutting — don't freehand.", "why": "Gives the straightest possible bandsaw lines and avoids 'drunk-driver cuts' that need heavy sanding.", "avoids": "Wavy edges needing excessive cleanup.", "quote": "so we're not doing drunk driver cuts", "time": "10:48", "flag": "HEARD"}, {"text": "Cut plate blanks oversized (a little over on the corners) from .125 chromoly drops, leaving 'extra juice' to trim radii later.", "why": "Extra material lets you trim out radius inconsistencies instead of scrapping the part.", "avoids": "Undersized/irreparable pads from radius errors.", "quote": "build the base plates a little bit of extra juice in them", "time": "8:10", "flag": "HEARD"}, {"text": "Mark an 'X' on matching sides of BOTH the template and the material to lock orientation and avoid flipping errors.", "why": "Consistent reference when transferring lines/holes, especially for mirrored left/right parts.", "avoids": "Flipped/mirrored layout errors on symmetric parts.", "quote": "let's just do an X on this and an X on this, so I know every time", "time": "6:43", "flag": "HEARD"}, {"text": "Wipe the plate down before pinning/transferring so debris doesn't lift the transfer pin ('tea bag' it).", "why": "Keeps the layout clean and the hole/shape transfer accurate.", "avoids": "Contaminated transfer mislocating holes.", "quote": "Get the material wiped down a little bit, so it doesn't tea bag our pin", "time": "9:55", "flag": "HEARD"}]}, {"title": "Shock Tuning for Prerunners — Geometry & Travel (MCD1 × KDM notes)", "desc": "Synthesised notes from Morgan's KDM Shock Technologies collaborations (Tundra prerunner, Vivian F-100) — geometry-first shock setup. Cross-video summary, NOT single-video verbatim; internal valving (shims/poppets) is tuner-specific (KDM), not Morgan's content.", "teachings": [{"text": "Set the geometry for maximum up-travel at ride height — Morgan went from ~6\" up-travel (on 30\" total) to ~13.75\" up-travel (~25-26\" total) by redesigning trailing arms and moving the shocks rearward/lower below centreline (notching the frame for clearance).", "why": "Too little up-travel at ride height means the bump/bypass zone engages early and the shock packs up.", "avoids": "Early bump-zone engagement, packing, and a harsh ride that won't use the travel it has.", "quote": "", "time": "", "flag": "NOTES"}, {"text": "Make sure the last ~4\" of shaft (the compression/bump zone, acting like a secondary bypass) is NOT nearly engaged at static ride height — set ride height to use the full stroke.", "why": "If the bump zone is already loaded at ride height, the shock is effectively stiff and bottoms early.", "avoids": "Early bottoming, harshness, and losing the benefit of the bypass tuning.", "quote": "", "time": "", "flag": "NOTES"}, {"text": "Step bump stops from 2\" to 4\" stroke and raise their chassis mounts; add upper/lower limit-strap tabs (same pivots) to control droop.", "why": "Bigger bump stops and proper straps let you run full travel without over-droop or hard bottoming.", "avoids": "Over-droop, harsh bottoming, or topping out.", "quote": "", "time": "", "flag": "NOTES"}, {"text": "Build trailing arms plate-on-tube ('canoe' style — e.g. 2\" × 0.120\" chromoly main tube) to hold tight frame-rail clearance through the full cycle while you relocate the coilover/bypass.", "why": "The construction keeps clearance to the rails through travel without giving up strength.", "avoids": "Arms fouling the frame rails at full cycle.", "quote": "", "time": "", "flag": "NOTES"}, {"text": "Send the shocks for a full rebuild/service and get the tuner (e.g. KDM) to calc spring rates from the vehicle weight; set ride height to a target exposed-shaft figure (e.g. ~9.5\" rear showing), then fine-tune preload/tubes. Expect a front spring change + preload tweak on first setup.", "why": "Correct spring rates for the real weight, plus a repeatable shaft-showing ride-height reference, are what make the geometry work.", "avoids": "Guessing spring rates or an unbalanced ride height that never settles.", "quote": "", "time": "", "flag": "NOTES"}, {"text": "Target roughly 60/40 rear weight bias for planted, predictable handling — use dual spares, fuel-cell relocation, lead ballast or a third tyre as temporary weight.", "why": "Rear bias keeps it planted; front-heavy setups plow and push.", "avoids": "A nose-heavy truck that plows in corners and feels unpredictable.", "quote": "", "time": "", "flag": "NOTES"}, {"text": "Nail the geometry 'recipe' for a strong out-of-box baseline, then fine-tune with spring swaps, tube adjustments and real desert testing (hot 100°F+ runs, whoops) — and weigh the vehicle post-build.", "why": "Good geometry gives the baseline; hot real-world running reveals heat soak, binding lines and bucking a bench setup won't.", "avoids": "A setup that looks fine cold but heat-soaks, binds or bucks in real conditions.", "quote": "", "time": "", "flag": "NOTES"}, {"text": "Keep the split clear: Morgan does fab, geometry and weight first, then professional shock service — internal valving (shims, poppets, bypass port mods) is tuner-specific (KDM), coordinated after the frame's built.", "why": "Get the chassis/geometry right yourself; leave internal valving to the shock tuner.", "avoids": "DIY-ing internal valving without a tuner, or expecting Morgan's content to cover poppet/shim drilling (it doesn't).", "quote": "", "time": "", "flag": "NOTES"}]}]}, {"name": "Cab Mounting & Body", "episodes": [{"title": "Prep and Welding on Selena", "desc": "Prepping (cleaning, DA sanding, wire wheeling) and silicon-bronze welding the cab/chassis seams and tube-to-sheet joints on Selena — tackling contaminated factory sheet metal and prior welds first.", "teachings": [{"text": "On contaminated factory cab sheet (WD40, even avocado/linseed oil, rust/grime): wire wheel + acetone, then DA sander/scotch pad, then silicon bronze at ~40–50 amps.", "why": "Oils on factory recycled sheet wreak havoc and are the hardest to remove; thorough prep gives clean fusion a fighting chance.", "avoids": "Porosity and failed welds that pull contaminants into the puddle.", "quote": "anything that's been wiped down with WD40 or anything even crazier like avocado oil", "time": "2:07", "flag": "HEARD"}, {"text": "For tube-to-sheet joints, build heat in the thicker TUBE first, then quickly 'bloop blast' the puddle across to the thin sheet — carry most of the puddle weight on the tube.", "why": "Accounts for the thickness mismatch so you get fusion without blowing through the sheet.", "avoids": "Burn-through on the sheet or a weak cold joint.", "quote": "build up heat in the tubing and the puddle. And then I'll just really quickly bloop blast over into the sheet metal", "time": "21:20", "flag": "HEARD"}, {"text": "Do the trickiest, dirtiest, hardest areas FIRST (clearanced cab/tyre areas, contaminated factory seams), then the easier joints.", "why": "Gets the sucky stuff done while fresh; leaving it for later breeds rushed, contaminated welds.", "avoids": "Burnout and inconsistent quality from saving the worst for last.", "quote": "hardest areas are going to be the factory sheet metal", "time": "5:32", "flag": "HEARD"}, {"text": "Standardise on red 2% thoriated tungsten across applications — don't swap tungsten type per material.", "why": "It performs reliably for his needs; the old strict per-material rules simplified to this without issue.", "avoids": "Unnecessary tungsten swaps mid-session slowing work.", "quote": "I don't change tungsten type per welding application", "time": "7:25", "flag": "HEARD"}, {"text": "On stubborn contaminated seams, run a HOT root pass first to smoke out grease, then wire-wheel the root and DA-sand before the final cover pass.", "why": "Burns the crap out of hard-to-reach seams and leaves a clean foundation that stays intact under the cover.", "avoids": "Persistent contamination causing ugly or failing welds.", "quote": "I'll just do like a hot root pass and it'll smoke out all the crap", "time": "30:34", "flag": "HEARD"}, {"text": "On an analog Syncrowave 250, set ~250A but run ~50% pedal — keep headroom to blip more amps rather than sitting at full throttle.", "why": "Gives extra amperage on tap when needed without constantly cooking chromoly/tube at full 250A.", "avoids": "Overheating and distorting tubes, or poor control over prior-weld overlaps.", "quote": "half 50% input on the throttle or the pedal", "time": "33:51", "flag": "HEARD"}]}]}, {"name": "Panel & Sheetmetal", "episodes": [{"title": "Work on the Sand Car Handmade Body Continues", "desc": "Hand-forming and tacking aluminium panels onto the sand car body — silicon bronze tacks, profile measuring and shaping for the handmade body.", "teachings": [{"text": "Tack sheet-to-tube in bodywork with silicon bronze rod, not regular steel filler.", "why": "Silicon bronze lays on the surface with little penetration, so later sanding won't undercut the tube — it behaves like piled-up rod.", "avoids": "Deep tacks that undercut the tube during finish sanding.", "quote": "silicon bronze doesn't really penetrate as much. It kind of just lays onto the material", "time": "1:51", "flag": "HEARD"}, {"text": "When tacking a new sheet to a rolled edge, only tack the section that ISN'T rolled, and use a helper to hold position.", "why": "Keeps the rolled area free for final forming and lets you adjust fit before committing.", "avoids": "Locking in a distorted or misaligned rolled edge.", "quote": "I'm only going to, you know, the part that's not rolled", "time": "6:20", "flag": "HEARD"}, {"text": "Bump amperage up for the first tacks on floppy sheet (he goes 0.5 → 1.5) to get a solid initial bite.", "why": "Gets good fusion on a floppy setup before final parameters are dialled.", "avoids": "Cold tacks that let go during handling.", "quote": "I'm going to juice these a little more... So, we're at 1.5", "time": "7:19", "flag": "HEARD"}, {"text": "Add extension pieces or extra tacks anywhere a panel will get floppy, before full welding.", "why": "Controls movement and supports the profile so it can't flex while you shape it.", "avoids": "Floppy panels shifting and twisting during fab.", "quote": "get a tack over here cuz it's going to get a little floppy", "time": "8:37", "flag": "HEARD"}, {"text": "Treat drawings as a shape reference, not exact scale — take crude on-car measurements and adjust to the real vehicle.", "why": "Drawings guide the bold shapes but real fit only comes from verifying on the car.", "avoids": "Cutting panels to a drawing that won't fit the actual chassis.", "quote": "They're a good reference. Doesn't mean that they're exactly just scale", "time": "14:09", "flag": "HEARD"}, {"text": "Use an existing panel/cut shape as a reference to transfer contours to new sheet (e.g. carrying the A-pillar line up).", "why": "Keeps new panels matching the body lines without introducing twist.", "avoids": "Mismatched contours that gap or twist.", "quote": "whatever shape is down here almost has to come up", "time": "18:54", "flag": "HEARD"}]}, {"title": "Hand Built Sand Car Body, Part 3", "desc": "Shaping and fitting body panels on the sand car — body lines, tipping/creasing with dies, fitment adjustments, and tack/weld sequence using hood props and pryers for alignment.", "teachings": [{"text": "Start a body line with tape, but follow up with a straight edge and hand work — especially on tapered/complex curves.", "why": "Tape starts the line but won't hold true on complex curves; the straight edge keeps the important bottom body line accurate.", "avoids": "Inconsistent body lines that don't hold true.", "quote": "what we want to be using is going to be uh straight edge", "time": "1:18", "flag": "HEARD"}, {"text": "When tipping/creasing matching pieces, stay in the EXACT same die groove for all passes (~4), and measure standoff from the threaded portion.", "why": "Going outside the groove shapes the metal differently; same groove plus consistent measurement gives matching standoff both sides.", "avoids": "Left/right panels shaped differently — broken symmetry.", "quote": "really important to stay in that same groove if you're doing multiple passes", "time": "9:56", "flag": "HEARD"}, {"text": "Use a Blue Point hood prop (or similar) as a hands-free support to hold/pressure panels for fitment and tacking when working solo.", "why": "Lets you work independently and still hammer or adjust while the panel stays put, especially on hard-to-reach seams.", "avoids": "Panels shifting during tacking for lack of support.", "quote": "This is a Blue Point hood prop", "time": "44:45", "flag": "HEARD"}, {"text": "Use a small offset pryer as a guide/reference for panel fitment adjustments where hands can't reach.", "why": "Gives precise feedback on alignment so you get a tight fit without forcing, especially after initial tacks.", "avoids": "Misaligned panels with gaps or stress.", "quote": "it's my little pryer in it... getting the the fitment right", "time": "35:39", "flag": "HEARD"}, {"text": "When hammering to close gaps/correct distortion, hit 'pretty hot' but never too hard, and watch which side of the panel you strike (don't upset the roll).", "why": "Too-hard hits ruin the work; the correct side preserves the formed rolls/creases while closing gaps.", "avoids": "Over-hammering that damages the rolled body lines.", "quote": "I'm sending these pretty hot... if you hit too hard you will not win", "time": "38:01", "flag": "HEARD"}, {"text": "Read the metal's feedback and fix small cracks or sanding contamination immediately with targeted, good-penetration welding before moving on.", "why": "The metal tells you about cracks/distortion early; fixing straight away prevents bigger problems despite miles of welding.", "avoids": "Small cracks/contamination propagating under stress.", "quote": "The metal kind of tells you", "time": "12:17", "flag": "HEARD"}]}, {"title": "Handmade Aluminium Sand Car Body, Part 2", "desc": "Fitting, trimming and shaping panels one side at a time — templates and tape, planning bead-roll sections, using the structure as its own fixture, and Zeus buttons for temporary hold.", "teachings": [{"text": "Final-trim the bottom edge of a panel FIRST, before shaping the other side or more complex work.", "why": "You know the final edge and don't have to trim twice on matching panels.", "avoids": "Repeated trimming and mismatched edges.", "quote": "I'll trim this so I know what the final is so I don't have to do it twice", "time": "2:07", "flag": "HEARD"}, {"text": "Don't get too far ahead on one side before matching the other — repeat processes symmetrically, side to side.", "why": "It's painful to go back once you're too far ahead; keeps the overall shape under control.", "avoids": "Asymmetric panels needing major rework to match.", "quote": "it sucks to go to the driver side", "time": "2:18", "flag": "HEARD"}, {"text": "For a long bead-rolled section: section it out, bead roll the panel separately, then reinstall, weld and planish before final fit.", "why": "Gets a big clean step-roll detail without distorting the long piece.", "avoids": "Distorted or weak step if rolled in place.", "quote": "section it, cut this out, bead roll this panel, then put it back, weld it, planishing hammer", "time": "2:59", "flag": "HEARD"}, {"text": "Mark key points with tape and trust that organic shapes smooth out small jogs — don't over-rigidly follow an imperfect layout line.", "why": "A layout with little jogs never stays exact on smooth organic shapes; it streamlines to the true line.", "avoids": "Forcing an unnatural trim line from an over-rigid layout.", "quote": "it's never right. It always ends up being a smooth streamline layout", "time": "3:42", "flag": "HEARD"}, {"text": "Once seams fit up, use the whole structure as its own fixture rather than clecoing everything heavily.", "why": "Clecoing the crap out of it is too involved and costs time and accuracy on a complex fit.", "avoids": "Excess temporary fasteners slowing progress and mis-aligning.", "quote": "use this whole structure as its own fixture", "time": "9:58", "flag": "HEARD"}, {"text": "Install Zeus buttons on the bottom of flimsy panels EARLY, before tightening up the assembly.", "why": "Stops the panel being too flimsy and avoids raise/lower surface errors from later adjustments.", "avoids": "Flimsy panel movement causing fit and surface errors.", "quote": "got to remember to put Zeus buttons on the bottom cuz I can kind of feel this thing's all flimsy", "time": "11:33", "flag": "HEARD"}, {"text": "Pre-bend template paper and land it on the aluminium to find lower trim lines — don't trust a flat template's curve.", "why": "Template paper curves lie; pre-bending and test-fitting reveals the harmonious real trim.", "avoids": "Inaccurate trim from a lying template, wasting aluminium.", "quote": "got a template paper curve that's going to lie to us. Put some pre-bend into this thing", "time": "11:45", "flag": "HEARD"}]}, {"title": "Starting the Hand Built Aluminium Body (series opener)", "desc": "Begins the hand-built aluminium body on a recaged two-seat Alumicraft sand car — establishing main body lines, perimeters, panel breaks, straight-edge references and Zeus-button placement while protecting the suspension.", "teachings": [{"text": "Tape off problem areas like the shocks before running straight edges or handling big panels.", "why": "Quick, dirty protection stops you marking or damaging suspension parts that get coated later.", "avoids": "Marking or ruining shocks during early body layout.", "quote": "run a little bit of tape um in the problem areas like the shocks", "time": "5:46", "flag": "HEARD"}, {"text": "Use a long straight edge to find where the panel wants to sit naturally, referencing fixed points (e.g. bypass shock top) and capturing the kick-out that grows rearward.", "why": "Finds the natural line, locates safe Zeus-button positions, and gives symmetric side-to-side data.", "avoids": "Unnatural body lines that don't flow with the chassis or match side to side.", "quote": "straight edge is telling me the natural line on that panel", "time": "8:38", "flag": "HEARD"}, {"text": "Build panels big initially and plan deliberate panel-separation lines (hood, step-rolls/shelves to capture the next panel) rather than overlaps.", "why": "Gives serviceability/removability and clean design features that follow the car's flow.", "avoids": "A one-piece body that won't come off, or ugly seams.", "quote": "step roll... shelf to capture the other panel", "time": "12:03", "flag": "HEARD"}, {"text": "Jump back and forth between sides when establishing surfaces — don't get too far ahead on one.", "why": "Keeps symmetry and uses one side as reference data for the other; easy to overcommit on a first-time body.", "avoids": "Asymmetric panels needing major correction.", "quote": "we're going to want to jump back and forth... really easy to get too far", "time": "10:40", "flag": "HEARD"}, {"text": "Leave extra material on initial panels and decide exact cut locations later, after the lower body line is established.", "why": "Keeps flexibility while you find the natural panel breaks and a platform for following pieces.", "avoids": "Short panels forcing patches or compromises.", "quote": "Probably leave a little extra. And then just really figuring out where that cut's going to be", "time": "2:46", "flag": "HEARD"}]}, {"title": "Carrie — Fuel Filler Panels, Part 3", "desc": "Building 3D-shaped aluminium fuel filler panels for Carrie — refining templates, forming subtle rolls/cones by hand, verifying on the car, and starting to fusion-tack corners.", "teachings": [{"text": "Use a clear template notation — a circled plus means 'add 1/8\" here' — and record overall additions (e.g. +1\" length) before transferring to sheet.", "why": "The first template is a concept shape; recorded revisions ensure final fit on the L/R panels.", "avoids": "Panels too short to reach connection points.", "quote": "that's actually like a plus sign with a circle around it. That means add an eighth", "time": "5:30", "flag": "HEARD"}, {"text": "Buy proper electric shears, not the cheap ones — the cheap blades dull fast.", "why": "Quality shears hold up to repeated template cutting; cheap ones dull and cost you downtime.", "avoids": "Constant dulling and halts mid-cut.", "quote": "I would definitely buy proper American expensive shears, not the Harbor Freight ones cuz they dole out faster", "time": "4:53", "flag": "HEARD"}, {"text": "Read the template's spread/roll marks (a conical roll, not parallel) to set driver-vs-passenger handedness BEFORE cutting/forming.", "why": "Identifies correct handedness and roll direction up front.", "avoids": "Mirrored or wrong-orientation panels.", "quote": "this spread indicates the roll and it's kind of a conical roll or a cone", "time": "5:10", "flag": "HEARD"}, {"text": "Form and fit the FIRST piece to the car to verify your added notes before cutting the second (mirror) piece.", "why": "Confirms the additions are accurate on-car, and the checked piece becomes the master for tracing.", "avoids": "Cutting both from an unverified template.", "quote": "I want to just verify that the additions from the notes are accurate", "time": "6:34", "flag": "HEARD"}, {"text": "Form subtle rolls/cones by hand — a simple pull/bump by feel — rather than reaching for the radius brake for small forms.", "why": "Sets the baseline shape fast on easy-forming material; a shallow angle needs very little, and over-forming crinkles it.", "avoids": "Flat or over-formed panels that won't transition smoothly.", "quote": "I do a lot of stuff by hand and by feel", "time": "7:53", "flag": "HEARD"}, {"text": "Prep aluminium edges with a medium-compound Scotch pad and remove any PVC coating where heat will go BEFORE welding.", "why": "Scotch removes what acetone misses; PVC near a weld is very hard to remove once heated.", "avoids": "Contaminated welds or baked-on PVC residue.", "quote": "if you put heat near it, it's a hard thing to get off", "time": "12:03", "flag": "HEARD"}, {"text": "On aluminium, get a fusion tack on the corner first (small cup), then pop it off to finish the remaining sides on the table.", "why": "Gets an initial hold in a tight spot, then lets you do the rest more easily on the bench.", "avoids": "Poor hold or distortion in tight areas.", "quote": "we got at least a corner hit on this thing", "time": "12:29", "flag": "HEARD"}]}, {"title": "Carrie — Fuel Filler Panels, Part 2", "desc": "3D templating with chipboard for the outer deflective shape and interior vent pickup on Carrie's Bronco fuel filler — tube transitions, base-plate-as-fastener, and planning for mesh/hardware access.", "teachings": [{"text": "Tape chipboard in place and transfer the footprint/outline of an angled tube onto the base-plate template before cutting metal.", "why": "Gives an accurate 1:1 physical template for the 3D shape, base-plate foundation and fastening locations.", "avoids": "Inaccurate tube integration or a misaligned base plate — poor fit or leaks.", "quote": "transfer onto the chipboard what the footprint of this tube is leaving", "time": "11:15", "flag": "HEARD"}, {"text": "Keep a vent/pickup tube opening at or above 'sea level' (level or angled slightly up) relative to surrounding structure.", "why": "Stops a low spot where moisture/dirt/debris collects and drops into the system; keeps vapour extraction clean.", "avoids": "A low pocket that pools moisture and debris.", "quote": "You want to make sure this thing doesn't go higher than sea level so it doesn't create a spot", "time": "6:59", "flag": "HEARD"}, {"text": "Cut the base plate from 1/8\" material and make it do double duty — design foundation AND hidden fastening device (capture from the back, no visible exterior hardware).", "why": "Gives stiffness against weld/assembly distortion and a clean seamless look while staying serviceable and mesh-ready.", "avoids": "Distorted/weak panels, visible hardware clutter, or no service access.", "quote": "act as the fastening device... cut it out of 8 in", "time": "12:00", "flag": "HEARD"}, {"text": "Don't place fasteners too close to a steep angle in the panel — leave room for full thread/bolt engagement and tool access.", "why": "A bolt next to a steep 3D form can't get enough thread reach in.", "avoids": "Insufficient thread engagement or blocked tool access on angled deflectors.", "quote": "if I mount hardware too close and then there's an angle, then you won't be able to get a long enough thread of bolt in there", "time": "15:42", "flag": "HEARD"}, {"text": "Mark aluminium layout with a scribe (e.g. Snap-on picks), not a marker, when you'll be acetone-cleaning and tacking.", "why": "Marker contaminates and is hard to remove cleanly from aluminium; a scribe is precise with no residue.", "avoids": "Marker contamination causing porosity or messy cleanup.", "quote": "I don't want to worry about the marker on there when I try to tack aluminum", "time": "39:31", "flag": "HEARD"}, {"text": "Leave the base-plate template slightly oversized (extra inboard/outboard), then trim to complement the final rolled radius after test fit.", "why": "Gives flexibility for the natural shape the metal wants and a complementary fit to adjacent tin without forcing it.", "avoids": "Forcing mismatched shapes or gaps.", "quote": "I'm going to leave this base plate a little bigger here... trim this to be complimentary to that", "time": "34:44", "flag": "HEARD"}]}, {"title": "Carrie — Fuel Filler Panels, Part 1", "desc": "Final welding/cleanup in the Carrie OBS Bronco interior, fitting the 75-gallon fuel cell, and making a chipboard template and chromoly beauty ring for the fuel-filler mount — layout, scribing and cutting method.", "teachings": [{"text": "Lightly wire-wheel inconsistent silicon-bronze areas then wipe WD-40 on before a fuel-cell install, and burp the root pass right into tight intersections.", "why": "Removes bronze residue/impurities without taking off the heat marks, and closes the root for a full weld in tight spots.", "avoids": "Contaminated welds or open roots around the fuel cell that leak under vibration.", "quote": "burp right into that intersection", "time": "5:52", "flag": "HEARD"}, {"text": "For a flat-panel fuel-filler mount, make a steel beauty ring/flange (.090 chromoly) and downsize the inner hardware (8-32) while the prominent outer fasteners (10-24) stay the design detail.", "why": "Gives a clean flat mount and keeps the visible fasteners as the intended feature.", "avoids": "Misaligned or overly prominent hardware ruining the clean look.", "quote": "This is a 10-24, so I'll do a... 8-32 just to downsize", "time": "14:05", "flag": "HEARD"}, {"text": "Lay a flange/ring out on .040 chipboard (Papermart), cut interior curves with radius scissors or air saw, scoring with a cutoff wheel first.", "why": "Chipboard gives a repeatable layout without double-laying steel; thinner stock cuts/forms well for the flange.", "avoids": "Inaccurate, non-repeatable hole/fitment layout on the steel.", "quote": "radius scissors... for cutting curvatures in chipboard", "time": "19:27", "flag": "HEARD"}, {"text": "For an even bolt circle, calculate the spacing (he used ChatGPT — e.g. 7 holes on a 2.75\" radius), then LIGHT-punch through the template and dot with a fine-tip Sharpie.", "why": "Quick precise even spacing with no manual-math errors; a light punch won't blow out the layout hole in paper or steel.", "avoids": "Uneven spacing or blown-out layout holes.", "quote": "radius from center line to the center line of each hole is 2.75 in... seven locations", "time": "25:10", "flag": "HEARD"}, {"text": "Prefer .063 chromoly over mild steel for a single-purpose flange when you have it, and cut on the INSIDE of the template line for a tighter final fit.", "why": "Chromoly is easier to cut and plenty for a flange welded to thin material; the inside cut tightens the fit on transfer to steel.", "avoids": "Weaker/harder-to-finish ring or a loose fit around the neck.", "quote": "if I have 063, I'm going to do that", "time": "23:49", "flag": "HEARD"}, {"text": "Always wipe material down before layout, and for a simple repeatable part use template transfer rather than over-investing in Dychem/aluminium mock-ups.", "why": "Stops the pen drying/clogging, and saves time where the geometry isn't critical.", "avoids": "Messy layouts or hours wasted over-mocking a non-critical part.", "quote": "I always wipe down the material before I lay it out", "time": "30:28", "flag": "HEARD"}]}, {"title": "Building an Aluminium Display Cowl — Frontier Prerunner (Fab Diaries)", "desc": "Designing, templating and fabricating a multi-piece .063 4130 aluminum display cowl to house a Holley Pro Dash in James' Frontier prerunner cabin.", "teachings": [{"text": "Use .063 4130 chromoly plate for the main backing / hard-mount plate — thin but stiff, matching the brake and shifter structures.", "why": "Lightweight rigidity that looks like sheet but performs like race-car plate in a tight cabin.", "avoids": "A flimsy or heavy mount that flexes and vibrates under prerunner abuse.", "quote": "we will use 063 4130 plate thin super strong", "time": "10:33", "flag": "HEARD"}, {"text": "Give yourself 1.5\" of extra wing per side on the backing-plate template, beyond the screen border.", "why": "Leaves room for mounting tabs and a stiffening break, with material to trim to the tubes after mock-up.", "avoids": "Too little material for secure tabs, forcing fit compromises around the A-pillar tubes.", "quote": "i gave myself an inch and a half of extra wing on each side", "time": "13:43", "flag": "HEARD"}, {"text": "Cut circular holes with a Roto Broach / sheet-metal hole-cutter system — lube it, correct speed, and stock all the common sizes.", "why": "Produces perfect circles in plate for screen ports and electronics exits without distortion.", "avoids": "Rough or oversized holes that distort the .063 plate or spoil the screen fit.", "quote": "using a roto broach system these are all like a hole cutter", "time": "14:40", "flag": "HEARD"}, {"text": "Build the cowl as two-plus pieces (bezel face + cap/cowl) with overlapping returns and Zeus quarter-turn fasteners for removability.", "why": "Lets you get around the tubes and intrusion bars and service the access panel, ECU and wiring.", "avoids": "A one-piece unit you can't install around the tubes, or that blocks ECU and access maintenance.", "quote": "a front face plate like a bezel and then a cap with a cowl", "time": "3:17", "flag": "HEARD"}, {"text": "Weld aluminium seams from the back side first, then the front — double-weld where you can.", "why": "Smooths the seam and stops it cracking when you sand material off the visible front face.", "avoids": "Surface cracks or weak seams on the show face after finishing, that fail under vibration.", "quote": "weld it from the back side first", "time": "50:57", "flag": "HEARD"}, {"text": "Use button-head fasteners for initial fit-up on aluminium panels, then switch to countersunk for final.", "why": "Speeds fab without dimpling every hole; finalise all the countersinks in one pass at the end.", "avoids": "Wasting time countersinking at every fit-up step on a complex multi-piece cowl.", "quote": "i like to use these button heads for my initial fabrication", "time": "45:39", "flag": "HEARD"}]}, {"title": "The Fab Diaries Ep.05 — Windshield Frame How-To (Truggy)", "desc": "Fabricating a custom aluminium windshield frame around factory glass for the Truggy — Zeus-button layout, adhesive-gap spacers, shrinking/stretching strips and walking-puddle TIG.", "teachings": [{"text": "Build a kick/angle into the top panel (~14\" back) specifically so a Zeus-button tool can still reach the fasteners.", "why": "Keeps the buttons serviceable after install while hiding internals and directing air and debris.", "avoids": "Zeus buttons you can't reach on the finished panel — no removal or maintenance without a major teardown.", "quote": "built this angle so you could still get a zeus button tool in here", "time": "1:45", "flag": "HEARD"}, {"text": "Make the side-frame strips (~4.5\"×28\") with returns, and set a 3/8\" spacer for the adhesive gap plus a 3/16–1/4\" perimeter gap around the glass.", "why": "Creates a consistent OEM-style glue space and keeps the frame parallel to the glass radii.", "avoids": "Bad glass seating or glue gap — leaks, movement or cracking under off-road vibration.", "quote": "a 3 8 spacer in between the glass and this shelf", "time": "13:55", "flag": "HEARD"}, {"text": "Once the layout's confirmed, fully weld the Zeus-button tabs — don't leave them tacked.", "why": "Tacks won't survive repeated on/off; full welds hold the centring-pin reference for drilling without shifting.", "avoids": "Tabs shifting during fit-up and drilling, putting the mounting holes out of line.", "quote": "tacks are only good so far", "time": "10:30", "flag": "HEARD"}, {"text": "TIG the spring plates/tabs without pulsing — hold a steady arc and walk the puddle, and start/end the tack at the edge so you don't burn it away.", "why": "Gives more consistent welds on thin attachments and protects the edges.", "avoids": "Burned or thinned tab edges and inconsistent welds that weaken the frame.", "quote": "not pulsing the tig when i'm welding the spring plates", "time": "11:53", "flag": "HEARD"}, {"text": "Run the side plates as a natural tangent to the glass arch (parallel sides) rather than forcing dips or heavy shrunk/stretched bows.", "why": "This glass has straighter sides than a big-radius screen, so a tangent fit is easier and more accurate.", "avoids": "Poor fit or over-working the metal — gaps, stress and breakage when fitting the factory glass.", "quote": "side plates are pretty parallel with the glass", "time": "5:11", "flag": "HEARD"}, {"text": "While forming the top strip, hold plane and gap with clecos and built-in standoffs/spacers as you shrink and stretch for the compound radius.", "why": "Keeps the glass and frame level, parallel and at an exact adhesive gap without clamp damage.", "avoids": "Misaligned planes or inconsistent gaps in the upper retainer — poor retention or visible waves.", "quote": "standoffs built in here with clecos", "time": "16:15", "flag": "HEARD"}]}, {"title": "The Fab Diaries Ep.04 — Roof Scoop How-To (Truggy)", "desc": "Planning and laying out the aluminium roof scoop on the Truggy — printed sketches for reference, a crown to beat visual sag, green-tape layout, Zeus-button grid and multi-piece construction.", "teachings": [{"text": "Print your preliminary sketches (a few copies — side profile + scoop views) and keep them on the bench as a physical reference instead of working from memory.", "why": "Gives a consistent tangible reference for radii, tapers and breaks on a flat chassis top.", "avoids": "An inconsistent scoop profile or misalignment with the windshield, forcing rework.", "quote": "a good tool to not just count on what you think you remember", "time": "0:47", "flag": "HEARD"}, {"text": "Put a slight crown / bump-up into the flat horizontal roof panel even when the chassis sits dead flat.", "why": "The eye reads a truly flat panel as sagging in the middle — a small crown looks straight and tasteful.", "avoids": "A finished roof panel that visually sags or looks like it's falling in the centre.", "quote": "even if you build this thing straight it'll still look like it sags", "time": "5:55", "flag": "HEARD"}, {"text": "Mark the actual panel edges and scoop-opening spread on the chassis with green tape (e.g. 12\" spread off the end gusset).", "why": "Gives a clear visual indicator for layout and lets you account for side-to-side differences before committing.", "avoids": "A misplaced scoop opening or side panels that don't line up with the chassis gussets and tubes.", "quote": "green tape as an indicator of the actual panel", "time": "6:18", "flag": "HEARD"}, {"text": "Mark where the horizontal material starts to break (e.g. 9¼\"), then nudge the Zeus-button locations to suit before you cut.", "why": "Keeps the buttons on one plane at even spacing for clean fastening — and earns a bit of design credit.", "avoids": "Awkwardly placed buttons that fasten badly or look misaligned under the new scoop form.", "quote": "where I want my horizontal material to start breaking", "time": "6:56", "flag": "HEARD"}, {"text": "Lay out a grid with a straight edge for the new Zeus-button locations on the modified roof before welding any plates.", "why": "Measuring off the cap tubes keeps it accurate and pays dividends in the final presentation.", "avoids": "An uneven button grid that leaves panels floppy, vibrating or poorly held.", "quote": "lay out a grid on here with a straight edge", "time": "8:03", "flag": "HEARD"}, {"text": "Plan the scoop as multiple pieces (radius rolls, breaks, a cap) with standoffs/posts in the middle for support.", "why": "Keeps each piece manageable to form, adds directional airflow, and stops the middle sagging or rattling.", "avoids": "A single-piece scoop or unsupported middle that sags, rattles, or kills the airflow.", "quote": "radius roll up", "time": "3:02", "flag": "HEARD"}]}, {"title": "The Fab Diaries Ep.03 — Panel Work: Design, Layout & Finish (Truggy)", "desc": "Reskinning the Truggy in aluminium — #6 Zeus-button spring plates, consolidating panels into a clean grid, and string/tape layout for bead rolls.", "teachings": [{"text": "Use #6 spring plates with #6 countersunk Zeus buttons for most panel work; tack each spring plate with four tacks and start the weld on a tack.", "why": "Thin material burns and eats its corners if you don't start on a tack; four tacks hold it so the centring tool finds the hole accurately.", "avoids": "Burn-through or eaten corners on thin spring plates, giving weak or misaligned button mounts.", "quote": "number six spring and then number six zeus button i always do countersunk", "time": "4:52", "flag": "HEARD"}, {"text": "If a spring plate needs to reach an offset spot, put a break/bend in it before welding.", "why": "Lets the plate extend to a custom location while keeping the spring tension for the quarter-turn fastener.", "avoids": "Spring plates that don't align or reach the mount, giving loose or non-functional fastening.", "quote": "you can put a break in them if you have to", "time": "3:57", "flag": "HEARD"}, {"text": "To build a Zeus-button grid, measure from button 1 to button 2, split the difference, and drop a new button in the middle to set a centreline.", "why": "Turns irregular tabs into a consistent, streamlined grid for symmetrical bead rolls and a cleaner look.", "avoids": "Cattywampus button spacing on consolidated panels — asymmetrical and poor visual flow.", "quote": "took my measurement from button one here to button two and split the difference", "time": "8:07", "flag": "HEARD"}, {"text": "Consolidate several old panels into fewer larger ones — remove the old seams (the ones with double buttons) to clean up the layout.", "why": "Cleans up the layout for a button grid and smoother bead-roll patterns across the reskin.", "avoids": "Retained creases/seams with double buttons — a busier layout with visible lines after bead rolling.", "quote": "consolidated panels just to clean it up", "time": "10:42", "flag": "HEARD"}, {"text": "For layout on complex curves, hang a string as a straight reference line instead of trusting the body surface.", "why": "The body kicks in and out, but from a distance the straight profile is what reads — the string tells the truth for big lines.", "avoids": "Bead-roll or panel lines that look wavy or off when viewed from a distance.", "quote": "the best thing to do is just hang a string", "time": "19:29", "flag": "HEARD"}, {"text": "Mock up the big shapes with wide/bold tape first, then fine-tune with marker lines once the main profile's locked in.", "why": "Tape expresses bold shapes fast and shows up well; bead rolling changes the surface a lot, so nail the big lines before fussing detail.", "avoids": "Over-focusing on fine detail early — bead rolls that don't translate or need major rework.", "quote": "tape is like a bold way to express the initial shapes", "time": "20:13", "flag": "HEARD"}]}, {"title": "The Fab Diaries Ep.01 — Mesh Cutout Panels, Part 1", "desc": "Layout, bead rolling and cutting aluminium mesh vent panels for the rear of a car — pattern, edge stepping and cutout tools/sequence before installing mesh.", "teachings": [{"text": "Bead roll/step the entire panel (including the perimeter step) FIRST, before any cutouts.", "why": "Bead rolling after cutouts distorts the panel, especially with only ~1\" between the bead roll and the cutout.", "avoids": "Warped panels that won't fit or look clean once meshed.", "quote": "you want to get that bead rolling done first", "time": "1:32", "flag": "HEARD"}, {"text": "Hold 3/4\" spacing from the bead-roll step to the cutout line.", "why": "Leaves enough material to capture the mesh under the step and room for hardware (10-24/10-32 or 1/8\" rivet) without pinching.", "avoids": "Pinched mesh/hardware or weak mounting.", "quote": "three quarters of an inch from bead roll step to cut out", "time": "3:04", "flag": "HEARD"}, {"text": "Straight cuts with a 4.5\" grinder + .045 cutoff wheel lubed with tube wax; switch to an air saw (Morse/Jag10 blade) for corners and radii.", "why": "The grinder is quick and low-heat on straights; the air saw is precise in corners; tube wax cuts ~50% better and stops aluminium packing the wheel.", "avoids": "Slow, hot cuts, packed wheels and imprecise radii.", "quote": "it'll make you cut 50 better", "time": "5:17", "flag": "HEARD"}, {"text": "Cushion clamps/vice grips against the panel with thick cardboard or template paper.", "why": "Prevents denting or marring the visible top surface.", "avoids": "Dents and marks on the finished face before mesh install.", "quote": "thick stock of cardboard or template paper", "time": "6:01", "flag": "HEARD"}, {"text": "Cut on the INSIDE of the layout line (on the material being removed), leaving a bit of line for final file cleanup.", "why": "You never cross into the keeper panel; close cuts plus a quick file give perfect radii.", "avoids": "Overshooting the line and ruining the edge.", "quote": "you want to be on the inside of your line", "time": "6:59", "flag": "HEARD"}, {"text": "Lay out with a FINE/dual-tip Sharpie, not a regular tip.", "why": "A regular tip is almost 1/8\" wide — too much error; a fine tip keeps layout tight for thin-blade cuts.", "avoids": "Wobbly, oversized cuts from a wide line.", "quote": "regular tip sharpie it's almost eighth inch wide", "time": "8:24", "flag": "HEARD"}]}, {"title": "The Fab Diaries Ep.02 — Mesh Cutout Panels Pt.2 (Truggy)", "desc": "Installing powder-coated mesh cutout panels — consistent hole layout, a mesh template, cutting 4×4 woven stainless, and bolting in with 10-24 stainless, anti-seize and a centre punch.", "teachings": [{"text": "Lay out the top and bottom holes parallel and consistent, with a gradual taper from the middle out to the edges.", "why": "Keeps even spacing and visual flow across the panel for a clean uniform look after powder coat and mesh.", "avoids": "Inconsistent or 'windy' hole patterns that look uneven once installed.", "quote": "keep them parallel through and that will even line up with this top one", "time": "1:10", "flag": "HEARD"}, {"text": "Space the mesh-mounting holes about 2\" on centre — more for flimsy mesh (woven), fewer for rigid.", "why": "Gives enough tension and hold at the corners without drilling unnecessary holes; suits 4×4 woven stainless.", "avoids": "Loose or over-perforated mesh that sags or rattles in the cutouts.", "quote": "these are spaced two inches and two inches on center", "time": "1:41", "flag": "HEARD"}, {"text": "Make a paper/card template by tracing the inside of the panel with a ~3/4\" margin, then cut the mesh to that.", "why": "Gets the mesh fitting accurately and square without repeated trimming after cutting.", "avoids": "Crooked or mis-sized mesh that needs extra fettling to fit the stepped cutouts.", "quote": "i guesstimated a three-quarter inch parameter here", "time": "3:56", "flag": "HEARD"}, {"text": "Line the mesh weave (the vertical/horizontal wires) square to the panel edges when you cut and install.", "why": "Stops the edges diving crooked and keeps the pattern visually lined up from any angle.", "avoids": "A misaligned mesh pattern that looks off or crooked on the finished panels.", "quote": "line the panel up so when you make the cuts everything is square", "time": "3:06", "flag": "HEARD"}, {"text": "Cut the woven stainless mesh with a 4.5\" grinder and cutoff wheel, with tape on top for a visible cut line.", "why": "It's effective for this material, and the tape gives a clear cutting guide on the mesh.", "avoids": "Inaccurate or messy mesh cuts that fit poorly in the openings.", "quote": "basic four and a half inch grinder with a cutoff wheel", "time": "6:10", "flag": "HEARD"}, {"text": "Put a little anti-seize on the threads of 10-24 stainless button-head hardware, and tighten from the nut/back side (not the hex top), slowly.", "why": "Stops stainless seizing for future removal and avoids stripping the button-head allen.", "avoids": "Seized or stripped stainless fasteners that wreck the mesh panels on disassembly.", "quote": "tighten things from the nut side of it and not the top hex side", "time": "8:00", "flag": "HEARD"}, {"text": "Use a centre punch to persuade misaligned mesh openings into line with the holes before you fit the hardware.", "why": "Lets you get perfect alignment even when the mesh doesn't sit exactly on the drilled holes.", "avoids": "Forcing misaligned mesh — bent wires, poor fit, or stress on the powder-coated panel.", "quote": "i just use it to persuade the mesh openings", "time": "8:21", "flag": "HEARD"}]}, {"title": "The Fab Diaries — Carrie Bedside Mesh Vent Panels", "desc": "Templating and forming dense 1/16\" woven stainless mesh into the compound-curved bedside vent openings on Carrie's fibreglass panel — paper templates, tipping die, relief cuts and a clean good-side/bad-side plan.", "teachings": [{"text": "Start with a rough 'sloppy Joe' burner of template paper (~1.5\" flange) just to gather data before refining.", "why": "Gives partial truth on the rigid woven mesh without committing to final accuracy too early.", "avoids": "Poor initial fit data — big gaps or mesh that won't conform to the fibreglass compound curves.", "quote": "sloppy Joe piece of template paper", "time": "4:39", "flag": "HEARD"}, {"text": "Treat the dense woven mesh as if it's a solid 16-gauge sheet when you lay out and run it through the bead roller / tipping die.", "why": "The 1/16\" interwoven stainless rod is hard to shape — this lets you put in a subtle arch, cone roll and breaks.", "avoids": "Mesh that won't hold the curves and rolls, leaving gaps against the irregular fibreglass.", "quote": "treat it like it's a 16 inch thick piece of material", "time": "7:57", "flag": "HEARD"}, {"text": "Plan a 'good side' (clean visible mesh, no upper hardware) and a 'bad side' (the dirty bolted mounting with flanges/ears, 1–2 rows of hardware).", "why": "On a pre-runner expecting rock and gravel hits from inside, simple bolted mounting is enough while the exterior stays clean.", "avoids": "Over-engineered framing or messy exposed mounts that waste time and hurt serviceability.", "quote": "good side and a bad side", "time": "2:59", "flag": "HEARD"}, {"text": "Use a tipping die on the bead roller for the break/tip in the mesh — accept the die (the Delrin lower especially) as a consumable.", "why": "It's how you introduce the needed non-straight tip/break for the arch and returns in rigid mesh.", "avoids": "No clean tip or break — poor contour match and visible gaps on the bedside vents.", "quote": "run the chipboard through the tipping die on the bead roller", "time": "7:42", "flag": "HEARD"}, {"text": "Add relief cuts and leave extra material (e.g. half the flange) in the high-stress fold areas for the cone roll.", "why": "Drops the rigidity so the mesh closes gaps and conforms to the irregular fibreglass without cracking.", "avoids": "Stressed or cracked mesh and persistent gaps at the tight-radius / compound areas.", "quote": "I'm going to relieve a lot of this", "time": "31:30", "flag": "HEARD"}, {"text": "Line the mesh up to the XY grid pattern (not on the diagonal), off a straight reference line, for the visible side.", "why": "Keeps a consistent, clean visual appearance for the focal mesh in the vent.", "avoids": "A misaligned 'drunk' mesh pattern that ruins the clean look.", "quote": "i like to line up the mesh", "time": "13:58", "flag": "HEARD"}]}, {"title": "The Fab Diaries — Carrie Fuel Vent Pt.4: Pumper Mount & Plumbing", "desc": "Mounting a PCI pumper to Carrie's fuel-vent system on a custom tabbed cage-tube plate — low/protected placement, brake-press templating, powder-coat hole clearance, and shop-organisation habits.", "teachings": [{"text": "Mount the PCI pumper low/sunk on the plate, below the cage-tube profile, with the filter elevated — and plan the tabs for rollover protection.", "why": "Keeps it protected yet accessible, with the air/volume knob reachable, without obstructing the cage tube or plumbing.", "avoids": "A pumper left exposed to rollover damage or fouling the cage tube and fuel-vent plumbing.", "quote": "sink this thing low right here", "time": "1:24", "flag": "HEARD"}, {"text": "Use yellow 3M 2097 tape (instead of green) for perimeter protection on parts that'll sit for a long time.", "why": "It peels off cleanly after long periods and sun exposure; green tape protects but leaves residue that's hard to clean.", "avoids": "Green-tape residue and mess on the mount plate after long fab time, complicating final install.", "quote": "this yellow tape is premium to me", "time": "3:38", "flag": "HEARD"}, {"text": "For non-critical mounting holes (like the pumper tab plate), go slightly bigger — e.g. 1/32\" up — for wiggle room.", "why": "Gives room for powder coat, alignment and easy assembly on 4-point surfaces without hurting strength.", "avoids": "Tight holes binding after powder coat — reaming or forcing misaligned plumbing.", "quote": "I might do a 30 second up", "time": "6:48", "flag": "HEARD"}, {"text": "When templating the plate, leave a 3/8\" ear on top before braking, and don't run right to a sharp point — leave extra and radius it on the sander after.", "why": "Stops weird folding/deformation in the brake press and lets you put a clean radius on afterwards.", "avoids": "Deformed or cracked brake edges on the tab plate — cut and rebuild.", "quote": "leave 38 of an ear on the top of this", "time": "9:01", "flag": "HEARD"}, {"text": "When you make a layout mistake (wrong brake location, say), scrap it and rebuild fast with a fresh template, noting the adjustment.", "why": "Recovery speed beats dwelling — it keeps momentum on the job.", "avoids": "Lingering on errors that slow the whole process and lead to frustration or rushed final work.", "quote": "it's about how fast you get out of the mud", "time": "11:03", "flag": "HEARD"}, {"text": "Keep a separate assembly / soft (plastic) table for parts and a dedicated fabrication/layout table — with a component bucket for items that live on the table.", "why": "Keeps the chaos down and stops clutter building up across multiple projects.", "avoids": "A cluttered workspace mixing pumper parts with other fab — more mistakes and cleanup time.", "quote": "you want like an assembly table or a soft table", "time": "2:05", "flag": "HEARD"}]}, {"title": "Building Aluminium Window Scoops on a SUV (Fab Diaries, Pt.2)", "desc": "Finishing the Explorer's aluminium window scoops — grinder/Jag-disc weld knockdown, filing radii, TIG-filling lows, scotch-pad fluff-and-buff before the DA, and an asymmetrical mesh layout on the fuel-filler side.", "teachings": [{"text": "Knock down welds/seams with a 4.5\" electric grinder-sander running a Jag 10 60-grit disc (not a flapper), with tube wax/box lube, on the clamped part.", "why": "Clamping frees both hands for control and a premium finish, and the lube makes the cut effective.", "avoids": "Bouncy one-handed sanding — uneven weld knockdown and a slower path to a premium finish.", "quote": "jag 10 60 grit sanding disc non flapper", "time": "1:19", "flag": "HEARD"}, {"text": "Put green tape (or heat shrink) on the file as a buffer when filing edges and radii.", "why": "Stops rogue dives scratching the visible aluminium during aggressive filing, and gives you perspective.", "avoids": "Scratches and gouges on scoop edges from file dives — extra rework to restore the finish.", "quote": "green tape for the win", "time": "4:10", "flag": "HEARD"}, {"text": "TIG-fill low spots/cavities (where hot welds pulled material) rather than sanding deeper and deeper.", "why": "Gets ahead of imperfections without endlessly thinning the material — spot it and fill it.", "avoids": "Persistent low spots or over-thinned aluminium that never levels out under the final finish.", "quote": "instead of trying to sand deeper and deeper", "time": "5:29", "flag": "HEARD"}, {"text": "File a radius by facing the top first, then the roll angle, working the file's feedback until it runs smooth.", "why": "Gives a consistent radius on rolled edges — the file shows highs and lows instantly across all four sides.", "avoids": "Lumpy, inconsistent radii on the scoop edges that show after assembly.", "quote": "the file does not lie once the file starts hitting smooth", "time": "4:44", "flag": "HEARD"}, {"text": "After the big sanding and filing, run a 3\" scotch pad on the electric sander to a shiny reflective finish ('fluff and buff level two') before the DA orbital.", "why": "It removes most scratches and clearly reveals waves/imperfections (the DA mutes them) — fix problems while they're visible.", "avoids": "Hidden waves or leftover scratches that only show up after the DA or in certain light.", "quote": "cut everything down to a shiny reflective surface", "time": "14:03", "flag": "HEARD"}, {"text": "On the fuel-filler side, run an asymmetrical mesh-cutout layout (scooted over, no 'ear', tailored to the D-pillar) and share a fastener for the mesh and the fuel-fill collar.", "why": "Fits the truck's fuel-filler position while keeping venting depth and secure mounting.", "avoids": "Mesh fouling the fuel filler, poor venting, or weak mounting on that side.", "quote": "this side of the truck is a little different because there's a fuel field", "time": "15:35", "flag": "HEARD"}]}]}]};</script>
<script>
const $=s=>document.querySelector(s);

/* ===== MY RESEARCH (not Morgan's words) — parallel, searchable knowledge base ===== */
/* Move the synthesised (non-verbatim) shock-geometry notes out of Morgan's pure section */
let _geom=null;
MC.stages.forEach(s=>{ if(s.name==='Suspension & Mounts'){ const i=s.episodes.findIndex(e=>e.title.indexOf('Shock Tuning for Prerunners')>=0); if(i>=0)_geom=s.episodes.splice(i,1)[0]; } });
const RESEARCH=[
  {name:"Shock geometry & travel (KDM × MCD notes)",
   desc:"My compiled notes on Morgan's geometry-first shock approach, synthesised across his KDM Shock Technologies collaboration videos — his methodology, but my synthesis, not his verbatim words. Internal valving is tuner (KDM), not Morgan.",
   teachings:(_geom?_geom.teachings:[]).map(t=>Object.assign({},t,{flag:"KDM×MCD NOTES"}))},
  {name:"Shock internals & rebound tuning",
   desc:"Forum and tuner-level internal valving — NOT Morgan's content. Drilling poppets and bleed, rate plates, internal spacers, and the rebound side. High-pressure nitrogen work — send shocks to a pro.",
   teachings:[
    {text:"Drill controlled bleed holes in the short compression-tube poppet for low-speed bleed — softens initial response on a light vehicle with big shocks without fully opening the tubes.", why:"Gives small-chop compliance while keeping the bump zone firmly valved.", avoids:"A vague, under-damped feel — or ruined seals from sloppy drilling.", quote:"", time:"", flag:"FORUM/TUNER"},
    {text:"Add free-bleed holes in the bypass tubes about half an inch to an inch above the factory ride-height zones, for more low-speed flow exactly where the shock lives.", why:"Relocates the soft bleed band to your actual ride height.", avoids:"Overdoing it — plug or tap them back if you lose control.", quote:"", time:"", flag:"FORUM/TUNER"},
    {text:"REBOUND: drill bleed holes in BOTH the compression and the rebound tube poppets so the ride zone gets overlapping soft bleed that tapers as the piston moves past it in either direction — and keep the piston itself solid, no bleed.", why:"Softens small chop around ride height in both directions while the bump zone and high-speed control stay firm.", avoids:"Bleed in the piston that softens the deep bump zone you want firm.", quote:"overlapping bleed, then taper past the ride zone", time:"", flag:"FORUM/TUNER · REBOUND"},
    {text:"Damping is not spring. Damping controls the SPEED the suspension moves — resistance to shaft velocity; the spring sets stiffness and ride height. 'Less rebound' means faster, freer extension, not a softer spring.", why:"Keeps your tuning language straight so you change the right thing.", avoids:"Chasing a damping problem by changing springs, or the reverse.", quote:"", time:"", flag:"PRINCIPLE"},
    {text:"Go conservative on rebound. Too little and the tyre can't extend fast enough to track the ground — you'll hear the engine rev between whoops — and low-speed rebound is what gives cornering control, so too little makes it wallow. Change one hole or half a turn at a time and re-test.", why:"Rebound is the hardest part of a setup to get right and the least forgiving.", avoids:"A floaty, skipping, wallowing truck from over-softening rebound.", quote:"", time:"", flag:"FORUM/TUNER · REBOUND"},
