    {text:"A bleed hole in the PISTON affects both compression and rebound — low-speed far more than high. To soften rebound only, use the directional rebound bypass tube, or thin and remove shims from the rebound shim stack.", why:"Piston bleed isn't direction-specific; the tubes and stacks are.", avoids:"Softening compression by accident when you only wanted rebound.", quote:"", time:"", flag:"FORUM/TUNER"},
    {text:"Use a rate plate — a rigid, non-flexing shim — in the piston stack for linear, predictable damping versus flexible shims, usually paired with a thin float shim for low breakaway.", why:"Consistent high-speed and bump control with softer low-speed compliance.", avoids:"Reach for it when standard shim stacks feel too progressive or unpredictable.", quote:"", time:"", flag:"FORUM/TUNER"},
    {text:"More, thinner shims give smoother, more progressive damping. Internal top-out and droop spacers limit over-extension and set shaft-showing at ride height; bump spacers cut compression travel or raise the bump zone to stop bottoming.", why:"Fine internal levers for ride-height position and end-of-travel control.", avoids:"Over-travel chewing seals, or inconsistent zones.", quote:"", time:"", flag:"FORUM/TUNER"},
    {text:"Tune in order: soften the compression first and get the chop livable, THEN fine-tune the rebound including the bleed — and change only one variable at a time, compression or rebound, front or rear.", why:"Isolates each change so you actually learn what did what.", avoids:"Chasing your tail by changing several things at once.", quote:"", time:"", flag:"FORUM/TUNER"},
    {text:"SAFETY: internal mods are on a high-pressure, nitrogen-charged shock. Done wrong you get blown seals, leaks or failure under load. Send shocks to a pro — KDM, Dialed Shock Prep — for internal work, especially the first round.", why:"A shock failure at speed in the desert is a crash risk.", avoids:"DIY internal valving without the gear or the experience.", quote:"", time:"", flag:"SAFETY"}
   ]},
  {name:"Aluminium panel stiffening",
   desc:"How to make large aluminium panels rigid without adding weight — the engineering principle plus the tools and techniques. Geometry, not alloy.",
   teachings:[
    {text:"You cannot make aluminium stiffer by changing alloy or temper — every aluminium alloy has essentially the same modulus, about 69 gigapascals. Alloy and temper change strength and formability, NOT stiffness. Rigidity comes only from thickness or shape.", why:"It reframes the whole problem: add geometry, don't chase a 'stiffer' alloy.", avoids:"Wasting money on a 'stronger' alloy expecting it to be stiffer.", quote:"", time:"", flag:"ENGINEERING"},
    {text:"Shape beats thickness. Flat-plate bending stiffness scales with thickness CUBED but weight only linearly — so forming a bead, crown or flange raises stiffness dramatically for almost no weight. A thin formed panel beats a thick flat one per kilo.", why:"This is the entire rigidity-without-weight win.", avoids:"Going thicker and heavier to fix a floppy flat panel.", quote:"", time:"", flag:"ENGINEERING"},
    {text:"Bead rolling is the number-one method — a rolled bead is a small integral I-beam. Run a grid of beads, parallel ribs, cross-hatch or X, and put a bead about 50 to 75 millimetres in from any free edge.", why:"Stiffens the panel across each bead, where floppiness starts.", avoids:"A big flat unsupported bay that oil-cans and drums.", quote:"", time:"", flag:"TOOL · bead roller"},
    {text:"Roll a slight crown into a flat panel — it turns a floppy plate into a stiff shell that can't deflect without stretching, and it kills oil-canning. Use an English wheel or curving rolls.", why:"Even a subtle crown massively stiffens a large flat area.", avoids:"A dead-flat panel that reads as sagging and drums.", quote:"", time:"", flag:"TOOL · English wheel"},
    {text:"Fold a 15 to 25 millimetre flange around the panel perimeter — the baking-tray effect, and the biggest stiffness for the effort on a flat panel. Use a box-and-pan brake, or flange dies on the bead roller.", why:"A stiff perimeter stops the edges flapping.", avoids:"Floppy unsupported edges.", quote:"", time:"", flag:"TOOL · brake"},
    {text:"For curved edges and gentle curvature use a shrinker-stretcher — it handles about 1.6 millimetre aluminium. Louvers stiffen AND vent for heat extraction in a floor or firewall, via louver dies.", why:"Curved flanges and louvers add stiffness and function.", avoids:"Forcing curves by hand and cracking the metal.", quote:"", time:"", flag:"TOOL"},
    {text:"Flanged lightening holes from your Crank dimple-die kit remove weight AND the flange stiffens — but only on non-sealed panels like gussets, tunnel sides, interior and seat bases, never a sealed floor.", why:"You get weight off plus a stiffening flange where sealing doesn't matter.", avoids:"Holing a floor that needs to seal the cabin.", quote:"", time:"", flag:"TOOL · dimple dies"},
    {text:"For big spans, rivet or bond brake-formed top-hat stringers to the back of the panel — aircraft skin-and-stringer — running across the longest unsupported dimension. Honeycomb sandwich panel is the ultimate stiffness-to-weight but it's bonded, not weldable.", why:"Targeted stiffeners add huge rigidity for minimal weight.", avoids:"A large single skin with nothing backing it.", quote:"", time:"", flag:"TECHNIQUE"},
    {text:"Pick the alloy by formability, not stiffness — they're equally stiff. 5052-H32 takes a bead more easily than 6061-T6; use 6061-T6 only where it bolts to structure or carries skid loads. Run thinner sheet and add shape rather than fighting thick T6 — hobby rollers handle about 1.6 millimetre aluminium anyway.", why:"Thinner formable sheet is lighter, stiffer once formed, and within tool capacity.", avoids:"Cracking hard T6 in the roller, or a needlessly heavy thick-flat floor.", quote:"", time:"", flag:"MATERIAL"}
   ]},
  {name:"Floor & belly protection",
   desc:"What trophy trucks use for floors and skid plates, and what a road-registered floor needs. Aluminium floor, targeted skids, and sealing the cabin.",
   teachings:[
    {text:"Trophy-truck floors are aluminium, not steel — steel is too heavy. Run about .125 inch, 3.2 millimetre, 6061-T6 for a mid-weight build; .063 inch is throwaway-thin. The truck sits high, so the floor isn't taking direct stick hits like a low crawler.", why:"Keeps weight down where a steel floor would cripple it.", avoids:"A heavy steel floor nobody runs on these.", quote:"", time:"", flag:"RESEARCH"},
    {text:"Puncture protection comes from targeted thick SKIDS under the engine, trans and fuel cell — not a thick whole floor. Options: thick aluminium, steel — heavy but cheap and abrasion-proof, weight sits low — or UHMW plastic, which is slick, light and slides over rocks and logs. Often metal-backed with UHMW over it.", why:"Protects the vulnerable low bits without weighing down the whole floor.", avoids:"Relying on a thin floor alone over the engine, trans and tank.", quote:"", time:"", flag:"RESEARCH"},
    {text:"Your pick — aluminium floor with UHMW over the belly — is the go-to: it slides over obstacles and is light. Back the UHMW with metal where impact is highest.", why:"Best of both: slick, light, and protected.", avoids:"Bare UHMW with no backing in the hardest-hit areas.", quote:"", time:"", flag:"RESEARCH"},
    {text:"A ROAD floor must seal the cabin from exhaust fumes, heat and debris — so keep it SOLID and add rigidity with beads from a bead roller, not lightening holes. Save dimple-die flanged holes for non-sealed panels.", why:"Beading stiffens while keeping the floor sealed and compliant.", avoids:"An open hole-punched floor that breaches the cabin seal and fails inspection.", quote:"", time:"", flag:"COMPLIANCE"},
    {text:"Compliance: VSB14 doesn't mandate a floor material — aluminium is fine and common in ICVs, street rods and kit cars. The intent is occupant protection, Section LK. On the ICV path the floor must be your own construction, not a production floorpan carrying a VIN. The final signoff is your SA signatory's call.", why:"Aluminium floor is acceptable if it's solid, sealed and your own build.", avoids:"Assuming it passes without confirming the spec with your signatory.", quote:"", time:"", flag:"COMPLIANCE"}
   ]},
  {name:"Transmission — TH400 vs ZF 8HP",
   desc:"My research comparing the bulletproof 3-speed TH400 against the modern 8-speed ZF 8HP for a street-plus-Finke LS truck — how the torque converter works, what makes each one tick, and whether the dual-mode lockup idea is real.",
   teachings:[
    {text:"A torque converter is a fluid coupling: it multiplies torque off the line AND allows slip — and that slip is what soaks driveline shock (whoops, landings, wheel hop) out of the gears and diff. A lockup clutch can clamp it solid for direct drive. Slip costs heat and a little power; lockup gets it back. This is why autos rule the desert.", why:"It's the single idea that explains both boxes and the whole dual-mode plan.", avoids:"Thinking a converter is just a soft clutch — the controllable slip is the point.", quote:"", time:"", flag:"PRINCIPLE"},
    {text:"The TH400 is bulletproof because it's overbuilt AND simple: a deliberately thick cast-aluminium case, a cast-iron centre section cradling the gears, a Simpson gearset (two planetaries sharing one sun), big clutch packs and a very strong input shaft — about 135 lb, three speeds (2.48/1.48/1.00). Fewer parts, fewer failures.", why:"Simplicity plus an overbuilt core is what makes it indestructible.", avoids:"Assuming more gears or modern tech automatically means stronger.", quote:"", time:"", flag:"TH400"},
    {text:"TH400 for the desert: dead-simple hydraulics (a full-manual valve body means zero electronics), field-serviceable anywhere with cheap parts everywhere, and the converter cushions the driveline inherently. It, and the Powerglide, is THE proven trophy-truck box.", why:"Out at Finke, simple and field-fixable beats clever.", avoids:"Being stranded by something you can't fix remotely.", quote:"", time:"", flag:"TH400"},
    {text:"TH400 downside on the street: only three ratios, NO overdrive and NO lockup — so highway revs are high (fuel and noise on a registered truck) and there are big rpm gaps where the engine drops out of its powerband on each shift. About 6 thousand dollars for a rebuildable core.", why:"It's a race box; road manners are the compromise.", avoids:"Expecting relaxed, economical cruising from a 3-speed.", quote:"", time:"", flag:"TH400"},
    {text:"The ZF 8HP is an 8-speed: four planetary sets and five shift elements (three multi-plate clutches, two brakes), with only three engaged in any gear so drag stays low. It has a lockup torque converter PLUS a twin-torsional damper, full mechatronics, about 201 lb, a 7-to-1 ratio spread and a tall first gear. It handles big power when controlled right.", why:"Eight gears keep the engine in its powerband and add a real overdrive.", avoids:"Underestimating it as just a road auto — it's behind M cars and Hellcats.", quote:"", time:"", flag:"8HP"},
    {text:"The 8HP lockup clutch is the key lever: it clamps the converter solid (the fluid coupling becomes a direct mechanical drive) for efficiency, and it can partially or fully UNLOCK on command. That lock and unlock is fully software-controllable via the TCU.", why:"Controllable lockup is exactly what your dual-mode idea needs.", avoids:"Thinking lockup is a fixed on-off you can't tune.", quote:"", time:"", flag:"8HP"},
    {text:"Standalone controllers — MaxxECU, TurboLamik, CanTCU — reflash the stock 8HP TCU with no internal rewiring and give full control of shift points, firmness and LOCKUP behaviour, plus virtual-clutch, clutch-kick and transbrake. This is your mate's wheelhouse; it's the same ecosystem as his 2JZ drift controller.", why:"It means the box can be tuned to do whatever modes you want.", avoids:"Buying an 8HP with no plan to control it — it won't run without a TCU.", quote:"", time:"", flag:"8HP"},
    {text:"Your dual-mode idea WORKS: map STREET to lock the converter early (direct drive, power down, fuel saved, quiet overdrive) and DESERT to unlock or allow slip (the fluid coupling soaks up the hits), recovering the slip loss by keeping the engine in its powerband across 8 gears. You can even logic-switch — lock on smooth sections, unlock under impact. The 500 kilowatt 2JZ drift car taking clutch-kicks with zero issues shows it takes abuse.", why:"It's the standout reason to choose the 8HP for a street-plus-desert truck.", avoids:"Assuming you must pick efficiency OR shock-absorption — you can switch.", quote:"", time:"", flag:"8HP · YOUR IDEA"},
    {text:"8HP caveats for sustained desert: slip makes HEAT, so in 40-degree-plus heat you MUST run a big trans cooler, monitor temp and use the correct ZF fluid — that's the number-one risk. The mechatronics are more sensitive to heat, vibration and dust than TH400 hydraulics; it's about 66 lb heavier and longer (recheck packaging and driveshaft length); and it's harder to field-fix at Finke. ZF say longevity hinges on cooling, fluid changes and correct CAN comms.", why:"Drift is short impulsive hits; desert is sustained heat and pounding for hours.", avoids:"Cooking the ATF or frying the electronics by skipping cooling and protection.", quote:"", time:"", flag:"8HP · CAVEAT"},
    {text:"For your build: the 8HP wants valid engine torque over CAN, so it pairs best with an EFI / drive-by-wire LS run by the SAME ECU (e.g. MaxxECU doing engine and trans on one box). A TH400 bolts to any LS with a simple bellhousing and needs nothing electronic. Decide on street manners plus your mate's tuning, versus dead-simple, light and field-fixable.", why:"The control architecture decides how clean the 8HP swap is.", avoids:"Pairing an 8HP with a carbed LS and fighting the integration.", quote:"", time:"", flag:"BUILD"}
   ]},
  {name:"Beadlock wheels — stop the bolts shearing",
   desc:"My research on why beadlock ring bolts shear and zipper off (learned the hard way on Dirty Life 17s) and the full fix — torque, pattern, thread treatment, hardware and the permanent thread-insert fix.",
   teachings:[
    {text:"Beadlock bolts shearing isn't bad luck — it's systematic. On Dirty Life wheels the root cause is that the ring bolts thread straight into the aluminium wheel, with no steel inserts. Steel bolts in soft aluminium threads, packed with desert sand, gall and seize — which gives you BOTH the in-service zipper failures and the bolts shearing off on removal.", why:"Knowing the real cause points straight at the fix.", avoids:"Blaming luck and changing nothing.", quote:"", time:"", flag:"ROOT CAUSE"},
    {text:"Over-torque is the number-one bolt-shearer. The Dirty Life spec is Grade 8, 5/16-18 by 1 and a quarter inch, at 18 to 24 ft-lb — and that is the CEILING, never more. A small grade-8 bolt torqued past spec stretches past yield, then fatigues and snaps. Use a calibrated torque wrench, NEVER an impact gun.", why:"The clamp comes from many bolts sharing load, not from cranking each one.", avoids:"Tighter-is-safer thinking that snaps bolts.", quote:"one ugga-dugga past spec and it breaks", time:"", flag:"TORQUE"},
    {text:"Torque the ring in a star or diagonal pattern over several passes — hand-tight all, then a roughly 10 ft-lb pass, then 18 to 24, then keep going around three or more passes because each bolt relaxes its neighbour until the ring seats evenly. Uneven clamp is what lets one bolt back out, overload the next, and zipper around the ring.", why:"It's a load-sharing problem, not a strength problem.", avoids:"The catastrophic zipper failure that dumps the tyre at speed.", quote:"", time:"", flag:"METHOD"},
    {text:"Use BLUE medium Loctite, not grease. It retains the bolt against vibration AND seals the thread from sand — fixing both the back-out and the galling at once. Never red on aluminium (you'd have to heat the wheel to remove it). Don't combine anti-seize with Loctite — anti-seize stops it curing. Plain grease or anti-seize lets bolts back out unless you re-torque constantly.", why:"One product solves both of your failure modes.", avoids:"Lubricated threads backing out, or seized bolts you can't remove.", quote:"", time:"", flag:"RETENTION"},
    {text:"Treat beadlock bolts as consumables — fit fresh Grade 8 5/16-18 by 1 and a quarter every trip; they're cents each. A bolt that's been torqued, heat-cycled and sand-blasted is fatigued, and re-torquing it just hurries the shear. AN/MS or ARP hardware is a worthwhile upgrade, but it still galls in bare aluminium without thread sealing.", why:"Fresh, correct-grade bolts don't fatigue-shear.", avoids:"Reusing tired bolts that snap.", quote:"", time:"", flag:"HARDWARE"},
    {text:"The permanent fix is steel thread inserts — Time-Sert or Keensert — in the wheel bolt holes, converting the soft-aluminium galling weak point into proper steel-on-steel threads that hold torque and don't gall. For a wheel that's destroyed this much hardware, this is the highest-value fix; short term, use the double-tapped second thread set by spinning the ring.", why:"It kills the actual weak link at the source.", avoids:"Endlessly chasing the symptom.", quote:"", time:"", flag:"PERMANENT FIX"},
    {text:"Re-torquing alone isn't enough — you proved that, checking every 100 km and still failing. Re-torquing a dying, over-stretched bolt just finishes it off. Fix the torque, galling, threads and bolts first; THEN re-torque, after the first heat cycle and then periodically, becomes the maintenance that keeps it together.", why:"Maintenance only works once the root cause is gone.", avoids:"Trusting re-torque to fix a design or torque problem.", quote:"", time:"", flag:"METHOD"},
    {text:"Run beadlocks at LOW pressure — that's what they're for. High road pressure at speed pushes the bead harder against the ring and adds bolt load plus heat. And keep them off the highway for long hauls: they're race wheels, not touring wheels — and beadlocks aren't road-legal in Australia anyway, so the registered side runs a DOT or ADR wheel.", why:"Lower joint load and heat means fewer failures.", avoids:"Cooking race wheels on the blacktop, and a compliance problem.", quote:"", time:"", flag:"PRESSURE / COMPLIANCE"}
   ]},
  {name:"Prerunner driving — jumps & racing",
   desc:"My research on how the best desert racers drive a long-travel truck — the jump preload technique, controlling attitude in the air, and the wider craft of driving an unstable trophy truck fast (BJ Baldwin and others).",
   teachings:[
    {text:"The jump preload technique (confirmed pro move): carry full throttle to the base, then halfway up the face give a firm brake jab to load and compress the front, then immediately get hard on the throttle off the lip. The compressed front springs back and weight shifts rearward, rocking the nose up to a flat or slightly nose-high attitude. Without it you rotate forward and lawn-dart.", why:"It rotates the nose up so you don't land nose-first.", avoids:"Nose-low launches that dig in and pitch you over.", quote:"halfway up the face, a big prod at the brake, then hard on the throttle", time:"", flag:"JUMPS"},
    {text:"The universal rule: be ON the throttle as you leave the lip and the nose stays up. Lift off or brake on the face and the nose drops. The brake-preload is an advanced refinement of this — powerful but timing-critical; brake too hard or too late and you launch nose-low.", why:"On-throttle takeoff is the single most important habit for safe jumps.", avoids:"Lifting at the lip and lawn-darting.", quote:"leave the face on the throttle and the front stays up", time:"", flag:"JUMPS"},
    {text:"In the air, throttle and brake are your attitude controls, exactly like a dirt bike: more throttle spins the rear wheels and rocks the nose UP; braking or chopping the throttle pulls the nose DOWN — using the rear wheels as a gyroscope. But the truck is heavy and the wheels are a small fraction of its mass, so it's a fine-trim tool, not a save-anything button — and SMALL inputs only, because aggressive mid-air inputs over-rotate you.", why:"It lets you trim the landing attitude after takeoff.", avoids:"Over-rotating from a big stab of throttle or brake mid-air.", quote:"use the throttle to control the rear wheels as a gyroscope", time:"", flag:"IN-AIR"},
    {text:"Chop the throttle just before you land. Landing with the wheels spinning hard slams the drivetrain when they suddenly grip — shock-loading the trans, diff and shafts. Get off it just before touchdown, land flat or slightly rear-first, then feed the throttle back in gently. Nose-first landings dig in and pitch you.", why:"Protects the driveline and keeps the landing stable.", avoids:"Shock-loading the gearbox and diff, or digging the nose in.", quote:"", time:"", flag:"LANDING"},
    {text:"Roll and yaw are mostly set at the lip — you can't correct roll in the air the way you can pitch. So take off square and straight with both sides loading evenly; a wheel dropping into a rut before the lip, or an uneven face, is what rolls you. Trail-brake into the jump to place the truck precisely on the ramp face, then back to throttle for the launch.", why:"A square takeoff is the only reliable way to stay level side-to-side.", avoids:"Cocked, rolling launches you can't fix mid-air.", quote:"", time:"", flag:"JUMPS"},
    {text:"Setup that helps jumps, straight from the shock research: slow the REAR rebound so the rear wheels don't extend too fast and push the nose down off the ramp; run a rear weight bias (over half the weight rearward — fuel cell and spares back there do this); stiff front spring plus bump stops so the front doesn't pack down and tip you forward; and vent the hood, because air under a flat hood at speed can flip a truck backward.", why:"The truck's attitude in the air is half driving, half setup.", avoids:"A nose-diving launch caused by too-fast rear rebound or a soft front.", quote:"", time:"", flag:"SETUP"},
    {text:"Carry momentum, rally-style. A trophy truck is very hard to slow down and reluctant to accelerate because of its weight, body roll and the rotating mass of a 37-inch tyre, so corner speed and momentum make the time — not braking hard and stabbing the throttle. Brake early (long stopping distances) and trail-brake to set up corners.", why:"Momentum is how you make time in a heavy, high-power truck.", avoids:"Scrubbing speed you can't easily get back.", quote:"the most unstable race vehicles in the world", time:"", flag:"RACING"},
    {text:"Smoothness above all, look far ahead, and pre-run the course. Long travel punishes abrupt inputs — BJ Baldwin had two inches of steering lock at 110 mph across 4-foot bumps as his whole margin, and when things come unglued they spiral fast. Drive the course beforehand and take notes; read the terrain way ahead because the truck reacts after you've seen it; and let the suspension do the work rather than fighting it.", why:"Smooth, anticipatory driving is what keeps an unstable truck pointed straight.", avoids:"Sudden inputs that upset the truck at speed.", quote:"", time:"", flag:"RACING"},
    {text:"Whoops: skim the tops at speed, stay light and let the suspension soak them — DON'T lift. Lifting in whoops drops the nose and risks an endo. Carry the speed and stay loose.", why:"Skimming is faster and safer than fighting each whoop.", avoids:"A nose-dive endo from lifting mid-whoops.", quote:"", time:"", flag:"WHOOPS"},
    {text:"These trucks are unstable and unforgiving — the most unstable race vehicles in the world, per Baldwin — and a jump gone wrong is a big crash. Build up progressively: small jumps first, learn the throttle timing off the lip before adding the brake-preload or in-air corrections; gear up properly (seat, harness, head-and-neck restraint, helmet); and accept that seat time is the real teacher.", why:"The consequences are high, so the learning curve must be gradual.", avoids:"Getting hurt by jumping beyond your experience.", quote:"", time:"", flag:"SAFETY"},
    {text:"Braking and corners: do the majority of your braking in a straight line, then trail the brakes into turn-in — that breaks the rear loose and helps the truck rotate, since it understeers otherwise. A quick downshift also loosens the rear to aid turn-in, and left-foot braking lets you balance and settle the truck without fully lifting. Smooth is fast.", why:"Trail braking and left-foot braking are how you make a heavy, understeering truck turn.", avoids:"Braking mid-corner and washing wide, or abrupt inputs that upset it.", quote:"smooth is fast", time:"", flag:"CORNERING"},
    {text:"Silt is the trap. When you hit it, point the truck, pick the right gear, commit and keep moving — do NOT lift or stop, because momentum is everything and stopping in silt means stuck. And the opposite rules for getting unstuck: stuck in SAND, air down first; stuck in SILT, do NOT air down.", why:"Silt and sand behave oppositely, and momentum is survival in both.", avoids:"Lifting in silt and burying the truck, or airing down in silt and digging in.", quote:"point the car, find the right gear, and keep moving", time:"", flag:"SILT / SAND"},
    {text:"Dust kills visibility for 30 seconds or more. In another truck's dust, back off — don't stop ON the course because someone's behind you — and pass later in a section you know well. A light tap on a rear quarter, called nerfing, is the desert way of saying let me by.", why:"You can't drive what you can't see, and stopping in dust is how big crashes happen.", avoids:"Driving blind in dust or parking in it on the racing line.", quote:"", time:"", flag:"DUST"},
    {text:"Finish first by first finishing. Roughly half the Baja 1000 field doesn't finish, so drive 70 to 80 percent, not 100, unless you have clear air. Mechanical sympathy is the skill — Larry Ragland's lesson was to make the truck faster without hurting it; don't break it before the flag, and remember brain-farts cause as many DNFs as breakages.", why:"Desert racing is attrition — the win goes to who survives, not who's fastest for ten minutes.", avoids:"Over-driving and breaking the truck or your concentration.", quote:"to finish first, you must first finish", time:"", flag:"STRATEGY"},
    {text:"Learn faster by following a quicker driver and copying their lines, braking points and corner and jump attitude — keep what they do faster than you and discard what's slower, and over time you assemble the best of everyone. Film yourself and review it, because you'll see mistakes you can't feel. And the universal rule: seat time, seat time, seat time.", why:"Imitation plus review is the fastest path; nothing replaces practice.", avoids:"Grinding away with no reference for what fast actually looks like.", quote:"", time:"", flag:"LEARNING"},
    {text:"Run metal foot restraints or 'shoes' over the throttle and brake pedals so your feet don't bounce off the controls over rough ground — the pros have them for exactly this reason. It's a small build detail that keeps your inputs accurate when the truck is getting thrown around.", why:"You can't modulate throttle and brake precisely if your feet are bouncing off the pedals.", avoids:"Losing pedal control over big hits.", quote:"", time:"", flag:"SETUP"},
    {text:"Your 17-inch wheel with a 37-inch tyre is the right call. A 17-inch wheel is the off-road gold standard up to a 37-inch tyre — go bigger on the wheel and you give up tyre compliance and risk smacking the rim on rocks. The desert saying is 'bigger tyre, smaller desert,' so run the most tyre you reasonably can on a 17.", why:"More tyre sidewall means more compliance and less rim damage — that's why million-dollar trucks run 17s.", avoids:"Chasing big shiny wheels that ride worse and damage easier.", quote:"bigger tyre, smaller desert", time:"", flag:"WHEELS"}
   ]},
  {name:"Cornering without rolling",
   desc:"My research on the vehicle and driver dynamics of keeping a tall, unstable truck off its roof in corners — why these things trip and roll, and the brake-rotate-then-drive-out technique (and why my drift habit of holding the slide is the dangerous one).",
   teachings:[
    {text:"About 95 percent of rollovers are 'tripped': the truck is sliding sideways and a tyre suddenly catches a rut, berm, soft sand or rock, and the sideways momentum pivots the truck over that planted wheel. On loose ground a vehicle tends to slide rather than roll, because the lateral forces stay small — it rolls when a tyre suddenly hooks grip while sideways speed is still there. That is exactly 'digging the corner in and flipping.'", why:"Understanding it's a tripping problem points straight at the fix: kill the sideways speed.", avoids:"Treating a rollover as bad luck instead of a predictable trip.", quote:"a furrow plowed during an off-road manoeuvre", time:"", flag:"PHYSICS"},
    {text:"The rollover threshold is the Static Stability Factor: SSF equals track divided by twice the centre-of-gravity height. Wider track and lower CoG raise it — so building low and wide is exactly right. But the catch: a soft, long-travel truck rolls EASIER than its rigid number suggests, because body roll and tyre and suspension compliance effectively narrow the track and shift the CoG outboard as it leans.", why:"It tells you why low-and-wide matters AND why you can't trust the raw number on a soft truck.", avoids:"Assuming a wide truck can't roll — compliance lowers the real threshold.", quote:"", time:"", flag:"SSF"},
    {text:"The drift trap, for me specifically: tarmac drifting lets you HOLD the slide because grip is uniform and the CoG is low, so it won't suddenly catch and won't trip. A tall truck on dirt is the opposite — variable grip, soft surfaces that catch, high CoG — so it WILL trip if a tyre hooks with sideways speed. Keep the rotation skill; unlearn the habit of holding the angle.", why:"My drift muscle-memory is the single most dangerous instinct to carry into this truck.", avoids:"Holding a big high-speed slide that trips and rolls.", quote:"", time:"", flag:"DRIFT TRAP"},
    {text:"Baldwin's technique, and why it works: brake hard and early, mostly in a straight line, to wash off speed BEFORE the corner so you carry little sideways velocity when it steps out; rotate and point the truck while it's slow (low sideways speed means low trip energy); then get hard on the gas before it finishes sliding to drive forward out of it. Rotate early and slow, then drive out — never a sustained sideways drift.", why:"It does the rotating at low energy, where a catch can't tip you.", avoids:"Carrying sideways speed into a spot where a tyre can hook and trip.", quote:"", time:"", flag:"TECHNIQUE"},
    {text:"Don't carry speed to the last second and then brake and steer at the same time — that loads the front and sideways together and gives away grip exactly when you need it most. A calmer entry lets the suspension settle. Getting back on the throttle as it pivots transfers weight rearward, plants the rears, brings wheel speed up to match the slide (restoring steering) and pulls the truck straight.", why:"Braking-and-steering-late is how you arrive sideways and fast — the worst combination.", avoids:"Overloading the front mid-corner and losing the grip you were counting on.", quote:"the curve isn't the enemy, the timing is", time:"", flag:"ENTRY"},
    {text:"The recovery instinct: if it starts to go, gently accelerate to bring wheel speed up to the sliding speed (that restores steering and direction) and smoothly unwind the lock. Do NOT stab the brakes mid-slide — that loads the fronts and can tuck and trip you — and do NOT snap a big counter-correction, because that sets up a pendulum that flicks back the other way and rolls you. If a roll is imminent and it's clear ahead, turn into the slide and drive out.", why:"The natural panic reactions (brake, big correction) are exactly what trips it.", avoids:"Pendulum rollovers from snap-corrections, and tuck-trips from mid-slide braking.", quote:"", time:"", flag:"RECOVERY"},
    {text:"Build factors beyond low and wide: anti-roll bars cut body roll, which stops the CoG migrating outboard and preserves effective track — a big rollover-resistance lever, balanced against off-road wheel compliance. Tyre pressure matters: too low and a tall sidewall folds or rolls under a hard side load, which itself trips you (and risks de-beading — why you run beadlocks). Bump stops and rebound control stop mid-corner lurches; the cage is the last line.", why:"Several setup choices change the real rollover threshold, not just track width.", avoids:"A soft, under-pressured, un-barred truck that rolls far below its SSF.", quote:"", time:"", flag:"BUILD"}
   ]},
  {name:"Prerunning & course notes (Finke)",
   desc:"My research on how the pros scout a course and build the GPS notes they race off — the tools, the workflow, the marking and calling system — applied to the Finke Desert Race format and hazards.",
   teachings:[
    {text:"Prerunning is driving the course before the race to learn it and build the notes you'll race off — it's what a prerunner truck is for. Good news: the rules in Australian off-road racing now allow GPS to navigate during a race, so this whole approach applies to Finke. Confirm the current Finke and Motorsport Australia regs for exactly what's permitted.", why:"Notes from prerunning are the difference between racing blind and racing informed.", avoids:"Showing up cold to a course that punishes the unprepared.", quote:"", time:"", flag:"WHAT IT IS"},
    {text:"The tool: Lowrance GPS is the desert-racing standard — rugged 'Baja' units built to survive shock and dust, run with as big a screen as you can fit because you're reading it while being shaken to bits. Garmin Tread XL is the satellite-view alternative for scouting lines, and LeadNav on an iPad lets you type far more detailed notes, then transfer them to the race-truck Lowrance. Pre-run in your race setup so braking distances and speeds match race day.", why:"The right, rugged, readable tool is what makes notes usable at speed.", avoids:"A fragile or tiny-screen unit you can't read when it counts.", quote:"", time:"", flag:"TOOL"},
    {text:"The workflow the fast teams use: don't crawl the course at 5 mph writing notes. Prerun at an observe-able pace, drop auto-numbered waypoints on the fly, keep a voice recorder calling out what each one is, then rename and detail them back at camp in the software. And the real weapon is simply seat time on course — the fast guys are out there the day prerun opens, grinding it out.", why:"Mark-then-detail-at-home lets you prerun at a real pace and still get accurate notes.", avoids:"Wasting prerun time, or having vague notes you can't trust.", quote:"", time:"", flag:"WORKFLOW"},
    {text:"The marking system: colour-code turns, hazards and pits separately; drop a hazard icon on the LEFT or RIGHT of the course line to show which side it's on; an exclamation point for a big rock or hole, and a skull-and-crossbones for a day-ender — but use the skull sparingly, because if you mark every rock with it, the driver starts ignoring your calls.", why:"A clear, consistent, sparse marking language is what keeps calls trustworthy.", avoids:"A cluttered screen and a driver who tunes out the warnings.", quote:"", time:"", flag:"MARKING"},
    {text:"Rate turns rally-style on a 1 to 6 scale (6 is flat-out, 1 is nearly stopped) — some use the number as the gear to take it in. And mark the GO, not just the SLOW: green 'faster than it looks' markers are where you actually find time, since most people only mark where to brake. Don't over-mark, though — in a straight full of whoops you don't need a marker every whoop; save them for holes, drops and jumps.", why:"Marking where to commit (offence) wins more time than only marking where to slow.", avoids:"Either a useless wall of markers, or leaving free speed on the table.", quote:"", time:"", flag:"SEVERITY"},
    {text:"Calling: give the driver only 1 to 2 seconds to react — call too early and they slow too early. Count down by distance (3, 2, 1 is .3, .2, .1 of a mile; on the brakes at 1, still on the gas at 3 and 2) off a steady zoom of about 0.6 mile. The navigator must memorise the icons before race day — reading them cold at speed doesn't work — and you tailor how much you call to what the driver wants.", why:"Timing and a studied navigator are what turn notes into lap time.", avoids:"Mistimed calls that slow the driver or arrive too late.", quote:"", time:"", flag:"CALLING"},
    {text:"Finke format: about 226 km each way (roughly 446 km round trip) on the Old Ghan railway road between Alice Springs and Aputula, over the King's Birthday long weekend. A prologue of about 8 km sets your start order, then you race Alice to Finke, camp overnight, and race back the same track reversed. Because it's a fixed, known track run BOTH directions, learn it in the official practice windows and build notes for each direction — a hazard looks different coming back.", why:"Finke's fixed two-way format means you can actually learn and note it properly, unlike a one-shot point-to-point.", avoids:"Treating the return leg as the same as the outbound — it isn't.", quote:"", time:"", flag:"FINKE FORMAT"},
    {text:"Finke hazards to mark: the kilometres of whoops (where they're deepest, where to skim), bulldust holes that can swallow a wheel, dry creek and Finke River crossings and washouts, sandy and rocky sections, and the jumps. The track gets rougher by Day 2 as the bikes and quads chop it, so plan notes and pace for a chewed-up return; dust kills passing on a one-vehicle-wide track, so clear air from a good prologue is worth a lot; and the game is to finish — get to Finke in one piece and play the long game.", why:"These are the specific things that end Finke races — mark them and respect the degradation.", avoids:"Getting caught out by a hidden bulldust hole, a washout, or a Day-2 track that's far rougher.", quote:"get to Finke in one piece", time:"", flag:"FINKE HAZARDS"},
    {text:"You don't need an expensive Lowrance to do the job. A used rugged Android tablet — or even a phone you already own — running a FREE offline app like OsmAnd or Locus Map, with the course loaded as a GPX and your hazards dropped as waypoints, does the core task: show the course line, your position, and the marked dangers. Add a cheap Bluetooth GPS puck (GlobalSat, Garmin GLO, Bad Elf) for an accurate fix on any tablet. A budget racer ran exactly this against a handheld Garmin and they were spot on.", why:"The edge in racing is the notes and the navigator, not the brand on the screen — so cheap-but-well-built plus great notes matches an expensive unit.", avoids:"Blowing a cash-strapped budget on hardware when the money is better spent on seat time.", quote:"", time:"", flag:"BUDGET NAV"},
    {text:"What you pay for in a Lowrance is ruggedness out of the box; a cheap tablet's weak points are heat shutdown, sunlight glare, vibration and power — and every one is something you can fabricate around. Build a sun shade over the screen with airflow (heat is the number-one killer), add a matte anti-glare film and run max brightness, mount it with vibration isolation, and hardwire 12V to USB so it never dies mid-stage. Download the offline map and load the course GPX BEFORE you leave phone service.", why:"Engineering the four failure points is what makes a cheap tablet survive the desert.", avoids:"A tablet that overheats, glares out, rattles to death or goes flat at the worst moment.", quote:"", time:"", flag:"BUDGET BUILD"}
   ]},
  {name:"Build priorities — finishing on a budget",
   desc:"My research on where to point every dollar and hour on a cash-strapped build aimed at finishing Finke — what to spend on, what to skip, the build order, and the testing and prep that actually make finishers.",
   teachings:[
    {text:"Finishing is the win, and it's rare — only 8 of 19 cars finished the 2017 Baja 1000, and first-time trucks built just for the big race finish at under 5 percent, because they skip testing and prep. Roughly half the field DNFs every year. So you don't beat a factory truck by outspending it — you beat it by finishing when it doesn't. Aim every dollar at finishing, reliability, safety and the driver.", why:"It reframes the whole budget — best means best-prepared and most-reliable, not most expensive.", avoids:"Going broke chasing a truck you can't out-spend anyway.", quote:"simply completing the course is enough of a victory", time:"", flag:"NORTH STAR"},
    {text:"Spend on the things that cause DNFs or save your life: a cage to Motorsport Australia spec, seat, harness and head-and-neck restraint; cooling for engine, trans and power steering with temp gauges (overheating is a top DNF); a proper fuel system plus serious dust filtration; tyres with two spares and the beadlock process sorted (punctures are a top DNF); driveline matched to your power; and fastener discipline, because vibration loosens everything over 446 km.", why:"These are the categories that actually end desert races — protect them first.", avoids:"A fast truck that breaks or overheats before the finish.", quote:"", time:"", flag:"SPEND"},
    {text:"Skip the cosmetics, the exotic billet and the chase for maximum horsepower. A reliable 500 to 600 horsepower that finishes beats a grenade 900 that DNFs — detune for reliability and you'll pass the fast guys while they sit broken in the pits. Defer the 3D scanner; it's the lowest priority. Looks and peak power don't get you to the finish line.", why:"Low-return spending is where cash-strapped builds quietly bleed out.", avoids:"Blowing the budget on bling and brittle peak power.", quote:"", time:"", flag:"SKIP"},
    {text:"The cheap edge is knowledge, not dollars: a well-tuned mid-tier shock beats a badly-tuned expensive one, a cheap tablet with great notes matches a Lowrance, and seat time is the biggest, cheapest gain there is. The driver is free horsepower — pour time into tuning, prerunning and technique before you pour money into parts.", why:"Skill and tuning out-perform spending, dollar for dollar.", avoids:"Believing the most expensive part is the fastest one.", quote:"", time:"", flag:"SMART SPEND"},
    {text:"Build in sequence: legal and safety foundation first — classify the frame and lock the rego path and cage BEFORE you cut, and close out your shed measurements because you can't design what you haven't measured. Then the drivetrain core, then suspension geometry and tuning, then wheels and tyres, then systems reliability and dust-proofing, then navigation — with driver development running in parallel the whole way through.", why:"A logical order respects dependencies and keeps a safe, finishing-capable truck at every stage.", avoids:"Building backwards and re-doing work, or bolting parts onto an unmeasured frame.", quote:"", time:"", flag:"ORDER"},
    {text:"Don't let Finke be the truck's first event — test it hard and run a shorter race first to shake out the weak points; the under-5-percent first-timer finish rate is cured by testing. Carry spares of what actually breaks (tyres, belts, shafts, CVs, hoses, fuel pump, fasteners) and the tools to fit them, line up a dedicated chase crew, and prep relentlessly between runs — because getting the truck and racing it once is the easy part, and maintaining the prep is the part most people never consider. That's where finishers are made.", why:"Testing and prep are the unglamorous things that separate finishers from DNFs.", avoids:"A maiden-voyage DNF at the one race you built the whole truck for.", quote:"prep your ride, test, race, repeat", time:"", flag:"TEST & PREP"}
   ]},
  {name:"Steering geometry & bump steer",
   desc:"My research on where to mount the steering and the geometry that eliminates bump steer on a long-travel A-arm truck — front vs rear of the bulkhead, the zero-bump rules, minimal Ackermann, and caster.",
   teachings:[
    {text:"Front vs rear of the bulkhead: the vertical position and length of the tie rods set BUMP STEER, while the fore/aft position sets ACKERMANN. So choose front-steer vs rear-steer mainly for Ackermann and packaging, and dial bump steer to zero either way. Front-steer trends to parallel, low Ackermann and toe-OUT in bump (the safer behaviour); rear-steer lets you build in Ackermann but trends toe-IN in bump (which digs). For high-speed stability front-steer fits, but your blown LS packaging may make the call.", why:"It tells you what the mounting choice actually controls, so you decide on the right basis.", avoids:"Mounting for the wrong reason and fighting bump steer afterwards.", quote:"", time:"", flag:"MOUNTING"},
    {text:"Zero bump steer on an A-arm front end needs three things: the OUTER tie rod pivot on the line through the upper and lower ball joints; the INNER tie rod pivot on the line through the upper-arm and lower-arm inner pivots; and the tie rod, extended, intersecting the Instant Center where those two lines meet. Match the tie rod's swing arc to the suspension's swing arc and the toe stays put through travel.", why:"These are the exact geometric rules that make toe stay constant through suspension travel.", avoids:"Wheels that steer themselves over every bump at speed.", quote:"", time:"", flag:"ZERO BUMP 1-2-3"},
    {text:"The reality: vertical position dominates bump steer, and you can't get perfect zero across 26-plus inches of travel — so center the toe-error curve at ride height and bias any residual to a TINY toe-OUT in bump, never toe-IN, because toe-in in bump is darty and digs the front. Race frames warp from welding, so shim the box, bellcrank and knuckle mounts, and MEASURE it on a bump-steer gauge at ride height with springs and sway bar off before you trust it.", why:"It turns the theory into a setup you can actually achieve and verify.", avoids:"A twitchy, digging front end you never measured.", quote:"", time:"", flag:"BUMP STEER REALITY"},
    {text:"Your minimal-Ackermann instinct is right: too much Ackermann scrubs speed and digs the inside front, and dirt tyres run such huge slip angles that static Ackermann is largely swamped anyway, so near-parallel is the desert norm. But a small amount helps you DRIVE through a corner instead of sliding it — without costing high-speed stability the way caster would — and if the rear runs a spool or locker, a touch of front Ackermann helps the truck turn instead of pushing.", why:"A little Ackermann supports your rotate-and-drive cornering plan without the downside of a lot.", avoids:"Either a truck that won't turn or one that digs from over-scrubbing.", quote:"", time:"", flag:"ACKERMANN"},
    {text:"Caster: run moderate-to-high, around 5 to 7 degrees, for the straight-line stability and self-centering a twitchy truck needs at speed. More caster means more self-centering but heavier steering (your ram assist covers that) and more tramlining if overdone. And yes, you can dial it on the upper-arm heims — lengthen one and shorten the other to tilt the steering axis fore/aft. Watch scrub radius too; get it more than ~10mm wrong and the steering fights you braking on split grip.", why:"Caster is your cheapest stability lever and it's adjustable on the truck.", avoids:"A nervous truck at speed, or one that tramlines and fights you.", quote:"", time:"", flag:"CASTER"},
    {text:"Sizing and redundancy: size the tie rods in 1 inch by 0.120 wall 4130 chromoly — that's a column-buckling safety factor above 3, the desert minimum; 1.25 inch only matters at full trophy-truck loads. The heims are unsealed, so service and inspect them often in dust. And run the tire-change lift rams off a SEPARATE hydraulic pump, not the power steering, because a steering-pump failure would otherwise sideline you mid-race.", why:"Correct sizing and a separate lift pump are what keep the steering alive over 446 km.", avoids:"A buckled tie rod, neglected heims, or a PS failure that ends your race at a tyre change.", quote:"", time:"", flag:"SIZING & REDUNDANCY"}
   ]},
  {name:"Air filtration for dust",
   desc:"My research on getting maximum dust protection AND maximum airflow for a supercharged LS in the desert — why you size up rather than trade off, the Donaldson standard, pre-cleaners, and sealing.",
   teachings:[
    {text:"You don't trade filtration for airflow — you size up to get both. Airflow is rated with a CLEAN filter; the moment it loads with silt it starts to choke, so run a filter with enough area (or run dual) that even loaded with dust it still flows your engine's full demand. In the desert even a stock 5.3 LS needs dual filters; a blown stroker needs serious area. Filtration is reliability — it's not how much faster you can go, it's how much longer you can go faster.", why:"It dissolves the false choice between flow and filtration — area gives you both.", avoids:"An undersized filter that chokes the engine after a few dusty miles.", quote:"how much longer you can go faster", time:"", flag:"SIZE UP FOR BOTH"},
    {text:"The filter: Donaldson PowerCore is the buggy and desert standard — its market is tractors and combines, serious sustained dust. Fluted straight-through media gives about three times an OEM panel's area, lower restriction, and sub-micron Ultra-Web efficiency, in round or obround shapes for tube-frame packaging, with a restriction indicator option. Skip K&N-style oiled gauze for the desert; it passes too much dirt.", why:"It's the proven media for exactly this environment.", avoids:"A pretty oiled-gauze filter that lets silt straight through.", quote:"", time:"", flag:"FILTER"},
    {text:"Size it for the blower: a supercharger moves a lot of air, so size the filter AND the pre-cleaner for your boosted CFM plus dust-loading margin — likely a large single or dual PowerCore, or a custom Walker Performance Filter, which are purpose-built dry desert filters specifically recommended by blown-LS teams. Match the filter to your actual airflow, not just the biggest tractor unit, which isn't optimised for high-RPM flow.", why:"A forced-induction engine's air demand has to be met even as the filter loads.", avoids:"Starving a blown engine, or fitting a filter that flows wrong for high RPM.", quote:"", time:"", flag:"BLOWN-LS SIZING"},
    {text:"Run a cyclonic pre-cleaner (particle separator) BEFORE the filter — it spins the bulk dust out before it reaches the media and hugely extends filter life in silt. Donaldson two-stage units have a built-in pre-cleaner that ejects pre-cleaned dust through a Vacuator valve or an exhaust ejector. On a bulldust-hole course like Finke it's the difference between one filter all weekend and choking mid-stage.", why:"Removing the bulk dust first is what lets a filter survive silt.", avoids:"A filter that loads up and chokes halfway through a dusty stage.", quote:"", time:"", flag:"PRE-CLEANER"},
    {text:"Filtration is only as good as the seal — a leak downstream of the filter is unfiltered dirt straight into the engine. Use radial-seal filters (far more sealing area than an O-ring), seal every joint and boot, run a sealed airbox, and pull the cleanest, coolest air you can, up out of the ground-level dust. Verify it with the grease test: smear grease on the boot downstream of the filter, run it, and if any dirt sticks you have a leak to find.", why:"A perfect filter with a leaking seal protects nothing.", avoids:"Silently feeding the engine dirt through an unsealed joint.", quote:"", time:"", flag:"SEALING"},
    {text:"Service it: change the filter after every race regardless of how it looks, and carry a spare. Dust loading is invisible from the outside until it's choking you, and a fresh filter is cheap insurance against a dust-related DNF.", why:"A clean filter every race is the cheapest reliability you can buy.", avoids:"Running a silently-loaded filter one race too long.", quote:"", time:"", flag:"SERVICE"}
   ]},
  {name:"Fuel system & surge tank for the desert",
   desc:"My research on the best fuel system and surge tank design for a blown LS prerunner — the layered architecture, surge tank shape, pump style, and how it applies to my GU-tank build.",
   teachings:[
    {text:"The whole job of the fuel system is to keep fuel at the high-pressure pickup through every jump, climb and high-G corner — because a blown engine that goes lean for one second melts a piston. A baffled tank alone is not enough off-road; the proper answer is layered: a foam-baffled cell or well-baffled main tank, a collector or HydraMat keeping fuel at the pickup, an active surge tank buffering the HP pumps, and redundant centred pickups so one is always submerged.", why:"Each layer covers the one before it, so a single starvation moment never reaches the engine.", avoids:"A lean spike under boost that melts a piston mid-stage.", quote:"", time:"", flag:"LAYERED ARCHITECTURE"},
    {text:"Surge tank shape matters: tall and narrow beats short and wide, because a tall column of fuel sits over the bottom pickup and stays there under cornering and braking G. Add a baffle or a slug of foam inside the surge tank itself so its own fuel does not float away from the pickup when the truck goes light at the top of a jump. Size it for the longest single starvation event, not for capacity — one to three litres is plenty — and have the lift pump continuously overfill it so it is always full going into a jump.", why:"Geometry and a full buffer are what keep the HP pickup fed through an airborne moment.", avoids:"A surge tank that empties or sloshes dry exactly when the truck is in the air.", quote:"", time:"", flag:"TALL & NARROW"},
    {text:"Run an ACTIVE surge tank — a dedicated low-pressure lift pump fills it and the high-pressure pumps draw from it — not a passive return-fed pot that can run dry. The lift pump must flow at least half the combined rating of the HP pumps, or the surge tank slowly drains under sustained demand. Mount the surge tank low and central, shielded from exhaust and turbo heat, firewalled from the cabin, because hot fuel vapour-locks and cavitates.", why:"An active, well-fed, cool surge tank is the buffer that actually survives a desert stage.", avoids:"A passive pot starving, or a heat-soaked tank cavitating next to the exhaust.", quote:"", time:"", flag:"ACTIVE + LIFT PUMP"},
    {text:"Pump style is a trade: external in-line pumps like the 044 are easy to swap trackside, a real desert advantage, but unsubmerged they run hotter and cavitate more easily if the feed goes light, so they MUST be kept fed by the lift pump. Internal in-surge pumps are submerged, so the fuel cools and lubricates them and they resist cavitation far better, but you open the tank to service one. Pick serviceability or cavitation resistance with eyes open.", why:"Knowing the trade lets you match pump style to how you will service the truck.", avoids:"An external pump pulling air and cavitating because nothing guaranteed its feed.", quote:"", time:"", flag:"EXTERNAL vs INTERNAL"},
    {text:"If flex-fuel is even a maybe, build the whole system E85-compatible from day one: alcohol-rated bladder, foam, seals and pumps, and PTFE lines, because ordinary rubber corrodes on ethanol and sheds debris that blocks pickups mid-race. This is exactly why a used surge tank with pumps of unknown fuel history is a gamble — confirm the pumps are E85-rated before trusting them.", why:"Ethanol-compatible from the start avoids a corroded system and a mid-race blockage.", avoids:"Rubber lines dissolving into the fuel and starving the engine.", quote:"", time:"", flag:"E85-READY"},
    {text:"The Aeroflow twin-044 surge tank I am looking at is the right architecture — active, twin HP pumps, external and serviceable — but it is the high-pressure side ONLY. It still needs the lift pump and the collector layer in front of it. Twin 044s are ample for a moderate blown petrol combo around 600 to 700 horsepower, but marginal on E85 or high boost, where a brushless surge setup is the heat-smart upgrade.", why:"Seeing where a unit fits the layered system stops me buying half a fuel system.", avoids:"Bolting in HP pumps with no lift feed and wondering why it still starves.", quote:"", time:"", flag:"THE UNIT IN CONTEXT"}
   ]},
  {name:"Forced induction — turbo vs supercharger on the LS",
   desc:"My research mapping turbo vs supercharger on an LS1 or LS3 for a desert prerunner — sizes, makes, expected power, supporting mods, fuel requirements and pump choice.",
   teachings:[
    {text:"For a dusty desert truck, heat is the enemy — so the biggest power number and the best desert engine are not the same answer. Turbos make the most power but dump huge underbonnet heat in the worst possible environment. Engine-wise, an LS1 is good for about 550 to 600 rwhp on stock internals with a good tune, and an LS3 for about 700 with its stronger block and better heads. Past those you are into forged internals. The block is rarely the limit on a sensible build — the tune and the fuel system are.", why:"Framing the choice around heat and the real stock limits stops a power-chasing mistake.", avoids:"Picking the hottest, laggiest setup for the dustiest environment.", quote:"the tune and the fuel system are the limit", time:"", flag:"HEAT IS THE ENEMY"},
    {text:"A roots or twin-screw supercharger (Whipple, Magnuson, Edelbrock, Harrop) sits on top and gives instant low-end torque with zero lag — ideal for corner exit and crawling out of silt. A twin-screw runs cooler than a roots. Downsides are belt drag, hood or scoop clearance, and no cheap kit, around 3500 to 7000 dollars plus. For reference an Edelbrock supercharged LS3 crate makes about 702 horsepower off the shelf.", why:"Instant torque and cooler running make a screw blower the desert-friendly choice.", avoids:"Lag in a technical section where you needed drive right now.", quote:"", time:"", flag:"ROOTS / TWIN-SCREW"},
    {text:"A centrifugal supercharger (ProCharger, Vortech) builds boost with RPM like a belt-driven turbo — efficient up top and easy to package on the front, but weaker low-end response than a screw blower. A ProCharger D1SC at 8 psi makes around 500 whp on a stock LS1 bottom end, and it is far easier to fit than a turbo. It needs an intercooler or aftercooler.", why:"It is the easiest blower to fit, at the cost of low-end grunt.", avoids:"Expecting screw-blower bottom-end punch from a centrifugal.", quote:"", time:"", flag:"CENTRIFUGAL"},
    {text:"Turbos make the most power because they use exhaust energy not belt drag, but they bring lag and soft tip-in below boost, big underbonnet heat, and intercooler and plumbing complexity — heat being the real desert problem. Single big turbo favours top-end, twin small favours response. One driveline note in the turbo favour: a blower instant torque hammers the driveline slack the moment you stab it, while a turbo softer build-up is gentler on the axles, diff and trans.", why:"It captures why turbos win on paper but cost you in heat, lag and complexity off-road.", avoids:"Underestimating turbo heat soak in dust, or driveline shock from instant blower torque.", quote:"", time:"", flag:"TURBO"},
    {text:"Supporting mods for any boost on a stock-ish LS, in priority order: a proper fuel system sized to power and fuel; a good tune, which is the single most important item because a bad one cracks hyper-piston ringlands; colder plugs and good coils; an intercooler, ideally air-to-water for desert heat-soak resistance; a boost controller; ARP head studs as boost climbs; upgraded valve springs and a boost-specific cam; and a driveline rated for the torque, my TH400 and 9 inch with a spool suit it. Above the stock power limit, add forged internals.", why:"Boost without the supporting mods is unreliable power that will not last a season.", avoids:"Cracking ringlands with a cheap tune, or detonating from a hot intake charge.", quote:"", time:"", flag:"SUPPORTING MODS"},
    {text:"Fuel sizing uses BSFC, about 0.5 for N/A petrol, 0.55 to 0.6 boosted petrol, and 0.65 to 0.7 on E85 which also needs 30 to 40 percent more volume. Pump flow in litres per hour is roughly horsepower times BSFC divided by 1.585, times about 1.33 again for E85, and always rate pumps AT pressure since flow drops as boost raises fuel pressure. On pumps: too small and it cannot meet flow, pressure falls, the engine leans and the starved pump cavitates; too large run flat-out as the primary and it overheats, heat-soaks the fuel and can cavitate from that heat. The fix is to size with 20 to 30 percent margin, run a return system, use PWM or brushless speed control, and stage a smaller primary with a bigger secondary that comes on under boost.", why:"This is how I avoid both the starve-and-cavitate and the overheat-and-cavitate failure modes.", avoids:"A lean-out from too little pump, or a heat-soaked oversized pump cooking the fuel.", quote:"too small starves, too large heats", time:"", flag:"FUEL & PUMP SIZING"}
   ]}
];

    e.teachings.forEach(t=>{
      const say=[t.text, t.why?('Why. '+t.why):'', t.quote?('In his words. '+t.quote):''].filter(Boolean).join(' ');
      const idx=push({kind:`${s.name}`,title:t.text,chap:s.name,teach:t,say,body:''});
      TEACH.push(Object.assign({},t,{stage:s.name,episode:e.title,trackIndex:idx}));
    });
  });
});

/* ---- MY RESEARCH section (not Morgan's words) — same track + search pipeline ---- */
if(RESEARCH.length){
  push({kind:'SECTION', title:'My Research', chap:'My Research', research:true, sectionHead:true,
    say:`My research. The following are my own compiled notes — not Morgan's words. They cover drilling and tuning shocks including the rebound side, stiffening aluminium panels without adding weight, and floor construction. You can ask questions across these the same way you ask Morgan.`,
    body:"My own researched notes — NOT Morgan's teachings. From forums, shock tuners and engineering. Ask across them the same as Morgan's."});
  RESEARCH.forEach(topic=>{

      const idx=push({kind:topic.name, title:t.text, chap:topic.name, teach:t, research:true, say, body:''});
      TEACH.push(Object.assign({},t,{stage:topic.name, episode:topic.name, trackIndex:idx, research:true}));
    });

}

/* ---------------- speech synthesis (audiobook voice) ---------------- */
const synth=window.speechSynthesis; let voice=null; let rate=0.97;
function loadVoice(){
  if(!synth) return;
  const vs=synth.getVoices(); if(!vs.length) return;
  const want=['en-AU','en-GB','en-US','en'];
  const sel=$('#voicesel');
  if(sel && sel.options.length<=1){
    vs.filter(v=>v.lang&&v.lang.startsWith('en')).forEach((v,i)=>{
      const o=document.createElement('option'); o.value=v.name; o.textContent=v.name.replace(/Microsoft|Google/,'').trim()+' · '+v.lang; sel.appendChild(o);
    });
  }
  if(!voice){ for(const w of want){ const v=vs.find(v=>v.lang&&v.lang.startsWith(w)); if(v){voice=v;break;} } if(!voice)voice=vs[0]; }
}
if(synth){ loadVoice(); synth.onvoiceschanged=loadVoice; }

let speaking=false, onDone=null, killed=false, primed=false, audioWarned=false, resumeTimer=null;
function prime(){ if(primed||!synth)return; primed=true; try{ const u=new SpeechSynthesisUtterance(' '); u.volume=0.01; synth.speak(u); }catch(e){} }
function keepAlive(on){ if(!synth)return;
  if(on){ if(resumeTimer)return; resumeTimer=setInterval(()=>{ try{ if(synth.speaking)synth.resume(); }catch(e){} },9000); }
  else { clearInterval(resumeTimer); resumeTimer=null; }
}
function audioWarn(){ if(audioWarned)return; audioWarned=true;
  $('#note').textContent='No sound? This in-app preview may block audio. Open in Chrome (⋯ → Open in browser) and turn media volume up — audio works from a downloaded file; only the mic needs https.';
}
function chunks(text){ // split without lookbehind (older webviews choke on it)
  text=text.replace(/\s+/g,' ').trim(); const out=[]; let buf='';
  for(const tok of text.split(' ')){ buf=buf?buf+' '+tok:tok;
    if(/[.!?]$/.test(tok)||buf.length>180){ out.push(buf); buf=''; } }
  if(buf)out.push(buf); return out.length?out:[text];
}
function speak(text,done){
  if(!synth){ audioWarn(); if(done)done(); return; }
  prime();
  if(synth.speaking||synth.pending){ try{synth.cancel();}catch(e){} }
  killed=false; onDone=done; speaking=true; keepAlive(true);
  const cs=chunks(text); let i=0, started=false;
  (function go(){
    if(killed){ speaking=false; keepAlive(false); return; }
    if(i>=cs.length){ speaking=false; keepAlive(false); const d=onDone; onDone=null; if(d)d(); return; }
    const u=new SpeechSynthesisUtterance(cs[i++]);
    if(voice)u.voice=voice; u.rate=rate; u.pitch=1; u.volume=1;
    u.onstart=()=>{ started=true; };
    u.onend=go; u.onerror=()=>{ go(); };
    try{ synth.speak(u); }catch(e){ audioWarn(); go(); }
  })();
  setTimeout(()=>{ if(speaking&&!started&&!synth.speaking&&!synth.pending) audioWarn(); }, 1500);
}
function stopSpeak(){ killed=true; if(synth){try{synth.cancel();}catch(e){}} speaking=false; onDone=null; keepAlive(false); }

/* ---------------- render a track / teaching ---------------- */
function render(item,echo){
  const _r = item.research || (item.teach&&item.teach.research);
  $('#kind').innerHTML = (_r?'<span class="flag rsch">MY RESEARCH</span> ':'') + item.kind + (item.teach&&item.teach.flag?` <span class="flag">${item.teach.flag}</span>`:'');
  $('#title').textContent = item.title||'';
  const t=item.teach;
  const q=$('#quote'), why=$('#why'), av=$('#avoids'), src=$('#src');
  if(t){
    if(t.quote){ q.textContent='“'+t.quote+'”'; q.classList.add('show'); } else q.classList.remove('show');
    if(t.why){ why.innerHTML='<b>Why.</b> '+t.why; why.classList.remove('hide'); } else why.classList.add('hide');
    if(t.avoids){ av.innerHTML='<b>Avoids.</b> '+t.avoids; av.classList.remove('hide'); } else av.classList.add('hide');
    src.textContent = `Source · ${item.episode||item.chap||''}${t.time?' · ~'+t.time:''}`;
  } else {
    q.classList.remove('show');
    if(item.body){ why.innerHTML=item.body; why.classList.remove('hide'); } else why.classList.add('hide');
    av.classList.add('hide'); src.textContent='';
  }
  const e=$('#ask-echo');
  if(echo){ e.textContent=echo; e.classList.add('show'); } else e.classList.remove('show');
}

/* ---------------- playback controller ---------------- */
let cur=0, playing=false;
function show(i,echo){ cur=Math.max(0,Math.min(tracks.length-1,i)); render(tracks[cur],echo); }
function setStatus(txt,cls){ const s=$('#status'); s.textContent=txt; s.className=cls||''; }
function setPlay(on){
  playing=on; $('#playlbl').textContent=on?'Pause':'Play';
  $('#play').querySelector('.ic').textContent=on?'⏸':'▶';
  if(on)setStatus('Playing','speak'); else if(!listening)setStatus('Ready','');
}
function playFrom(i){
  show(i); setPlay(true);
  speak(tracks[cur].say, ()=>{ if(!playing)return;
    if(cur<tracks.length-1){ playFrom(cur+1); } else { setPlay(false); }
  });
}
function noAudioBanner(){
  const e=$('#ask-echo');
  e.innerHTML='⚠ This in-app preview can’t play sound. Tap ⋮ (top-right) → <b>Open in browser</b> / Chrome, then Play.';
  e.classList.add('show'); setStatus('Open in Chrome','');
}
function togglePlay(){
  if(!synth){ noAudioBanner(); return; }
  if(playing){ stopSpeak(); setPlay(false); }
  else playFrom(cur);
}
function nav(d){ const wasPlay=playing; stopSpeak(); show(cur+d); if(wasPlay)playFrom(cur); else { setPlay(false); speak(tracks[cur].say,()=>{}); } }

$('#play').onclick=togglePlay;
$('#next').onclick=()=>nav(1);
$('#prev').onclick=()=>nav(-1);

/* ---------------- Q&A: keyword + concept search over 84 teachings ---------------- */
const STOP=new Set('the a an and or to of in on for with how do does what when why is are be can i it my me your you that this at as so if not no into get got use using over under off out up onto a about'.split(' '));
const SYN={
 prep:['clean','cleaning','contamination','contaminant','acetone','rag','wipe','rust','bright','wirewheel','degrease','grind','grinding','dirty','prepped','prepare','preparation','solvent'],
 heat:['warp','warping','distort','distortion','pull','pulling','twist','twisting','expansion','contraction','move','moving','heatsink','sink','soak','hot','cooling','warped'],
 tack:['tacks','tacking','tacked','stitch','stitches','spot'],
 filler:['rod','rods','wire','consumable','consumables','er80','er70','bronze','silicon','sif','045','116'],
 weld:['welding','welded','puddle','torch','tungsten','amps','amperage','pedal','arc','penetration','fusion','root','cap','pass','double','tig','gtaw','watercooled','cooled','machine'],
 mount:['mounts','mounting','bracket','brackets','tab','tabs','bung','bungs','gusset','gussets','boss','clevis','heim','tube'],
 notch:['notching','cope','coping','fishmouth','miter','mitre','joint','joints','chromoly','cromoly','4130','dom','fit','fitup'],
 panel:['panels','sheet','sheetmetal','metal','skin','quarter','fender','flange','edge','body','bodywork','door'],
 bead:['beadroll','roller','rolling','rolled','stiffen','stiffening','rib','ribs','crease'],
 shrink:['shrinking','stretch','stretching','planish','planishing','english','hammer','dolly','shrinker','stretcher','curve','curved'],
 cleco:['clecos','cleko','plink','clamp','clamps','clamping','fixture','jig','hold','holding','position','crazy','glue','ca'],
 design:['render','renders','sketch','sketching','photoshop','wacom','mockup','mock','prototype','printed','print','cad','draw','drawing','digital','machinist'],
 fitment:['fitting','gap','gaps','align','alignment','clash','interference','clearance','vibe'],
 suspension:['shock','shocks','tower','towers','link','links','fourlink','arm','arms','trailing','radius','coilover','sway'],
 cab:['cabin','firewall','floor','chassis','frame'],
 rebound:['extension','droop','bleed','poppet','valving','valve','shim','shims','damping','damp','revalve','internal','bypass','tube','tubes','compression','stack','spring'],
 skid:['skidplate','belly','uhmw','underbody','protection','plate','floorpan','seal','sealed'],
 rigidity:['rigid','stiffen','stiffness','stiffening','crown','flange','flanges','louver','louvre','honeycomb','oilcan','modulus','formable','aluminium','aluminum','bead','beadroll','panel']
};
function toks(s){
  const raw=(s.toLowerCase().match(/[a-z0-9]+/g)||[]).filter(w=>w.length>2&&!STOP.has(w));
  const out=[];
  raw.forEach(w=>{ out.push(w);
    if(w.length>4&&w.endsWith('es')) out.push(w.slice(0,-2));
    else if(w.length>3&&w.endsWith('s')&&!w.endsWith('ss')) out.push(w.slice(0,-1));
  });
  return out;
}
function expand(ts){ const out=new Set(ts);
  ts.forEach(t=>{ for(const k in SYN){ if(k===t||SYN[k].includes(t)){ out.add(k); SYN[k].forEach(x=>out.add(x)); } } });
  return [...out];
}
// precompute weighted term frequencies per teaching
TEACH.forEach(t=>{
  const blob=[t.text,t.text,t.text, t.episode,t.episode, t.stage, t.why,t.why, t.avoids, t.quote].join(' ');
  const f={}; toks(blob).forEach(w=>{ f[w]=(f[w]||0)+1; }); t._f=f;
});
function search(q){
  const base=toks(q); if(!base.length)return [];
  const baseSet=new Set(base); const qt=expand(base);
  const scored=TEACH.map(t=>{ let s=0; qt.forEach(w=>{ if(t._f[w]) s+=t._f[w]*(baseSet.has(w)?3:1); }); return {t,s}; })
    .filter(x=>x.s>0).sort((a,b)=>b.s-a.s);
  return scored.map(x=>x.t);
}

let lastResults=[], resultIdx=0;
function answer(query){
  // command words first
  const c=query.toLowerCase().trim();
  const wc=c.split(/\s+/).filter(Boolean).length;
  // short utterances = playback commands (so full questions aren't hijacked)
  if(wc<=2){
    if(/^(play|resume|start|go|continue|unpause)\b/.test(c)){ if(!playing)togglePlay(); return; }
    if(/^(pause|stop|wait|quiet|silence|halt)\b/.test(c)||c==='shut up'){ stopSpeak(); setPlay(false); setStatus('Ready',''); return; }
    if(/\b(next|skip|forward)\b/.test(c)){ nav(1); return; }
    if(/\b(back|previous|prev|last)\b/.test(c)){ nav(-1); return; }
    if(/\b(repeat|again|rewind)\b/.test(c)){ stopSpeak(); speak(tracks[cur].say,()=>{}); return; }
    if(/\b(louder|faster|speed)\b/.test(c)){ rate=Math.min(1.4,rate+0.1); flashNote('Rate '+rate.toFixed(2)); return; }
    if(/\b(slower|slow)\b/.test(c)){ rate=Math.max(0.6,rate-0.1); flashNote('Rate '+rate.toFixed(2)); return; }
  }
  if(/^(principles?|master principles?)\b/.test(c)||/\bthe principles?\b/.test(c)){ stopSpeak(); const i=tracks.findIndex(t=>t.chap==='Master Principles'&&t.kind==='CHAPTER'); playFrom(i); return; }
  if(wc<=3 && /\b(another|next one|other one|different one)\b/.test(c) && lastResults.length){
    resultIdx=(resultIdx+1)%lastResults.length; speakTeaching(lastResults[resultIdx],`Another on that:`); return;
  }
  // otherwise: a real question
  const res=search(query); lastResults=res; resultIdx=0;
  if(!res.length){
    render(tracks[cur], `Asked: “${query}”`);
    speak(`I could not find a teaching for that. Try asking about prep, heat and warping, tacking, filler rod, bead rolling, or mounts — or from my research, rebound and shock bleed, stiffening aluminium panels, or floor and skid plates.`, reArm);
    setStatus('No match',''); return;
  }
  speakTeaching(res[0], `Asked: “${query}”`);
}
function speakTeaching(t, echo){
  const item={kind:t.stage,title:t.text,teach:t,episode:t.episode,chap:t.stage,research:t.research};
  render(item, echo);
  cur=t.trackIndex; setPlay(false);
  const say=[t.text, t.why?('Why. '+t.why):'', t.quote?((t.research?'Note. ':'Morgan said. ')+t.quote):''].filter(Boolean).join(' ');
  setStatus('Answering','speak');
  speak(say, reArm);
}
function flashNote(m){ const n=$('#note'); n.textContent=m; setTimeout(()=>{ if(n.textContent===m)n.textContent=baseNote(); },1600); }

/* ---------------- speech recognition (voice in) ---------------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let listening=false, handsfree=false, rec=null;
function reArm(){ if(handsfree) setTimeout(()=>{ if(handsfree&&!listening)listen(); },700); else setStatus('Ready',''); }
function listen(){
  if(!SR){ $('#txtwrap').classList.add('show'); $('#txt').focus(); return; }
  if(listening)return;
  stopSpeak(); setPlay(false);
  rec=new SR(); rec.lang='en-AU'; rec.interimResults=false; rec.maxAlternatives=3; rec.continuous=false;
  listening=true; setStatus('Listening…','listen'); $('#ask').classList.add('live');
  rec.onresult=e=>{ const q=e.results[0][0].transcript.trim(); endListen(); setStatus('Thinking…','think'); setTimeout(()=>answer(q),120); };
  rec.onerror=e=>{ endListen();
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){ flashNote('Mic blocked — needs https & permission. Use text below.'); $('#txtwrap').classList.add('show'); handsfree=false; $('#hf').classList.remove('on'); }
    else if(e.error==='no-speech'){ if(handsfree)reArm(); else setStatus('Ready',''); }
    else setStatus('Ready','');
  };
  rec.onend=()=>{ if(listening)endListen(); };
  try{ rec.start(); }catch(err){ endListen(); }
}
function endListen(){ listening=false; $('#ask').classList.remove('live'); try{rec&&rec.stop();}catch(e){} }
$('#ask').onclick=()=>{ if(listening){ endListen(); setStatus('Ready',''); } else listen(); };
$('#hf').onclick=()=>{ handsfree=!handsfree; $('#hf').classList.toggle('on',handsfree);
  flashNote(handsfree?'Hands-free ON — I’ll keep listening after each answer':'Hands-free off');
  if(handsfree&&!listening&&!speaking)listen();
};
$('#txtgo').onclick=()=>{ const q=$('#txt').value.trim(); if(q){ setStatus('Thinking…','think'); answer(q); $('#txt').value=''; } };
$('#txt').addEventListener('keydown',e=>{ if(e.key==='Enter')$('#txtgo').click(); });

/* ---------------- rate buttons ---------------- */
$('#slow').onclick=()=>{ rate=Math.max(0.6,rate-0.08); flashNote('Rate '+rate.toFixed(2)); };
$('#fast').onclick=()=>{ rate=Math.min(1.4,rate+0.08); flashNote('Rate '+rate.toFixed(2)); };

/* ---------------- chapters sheet ---------------- */
function buildChapters(){
  const c=$('#chapters');
  let mor='', res='';
  tracks.forEach((t,i)=>{
    let h='';
    if(t.kind==='WELCOME'){ h=`<div class="chap">Start</div><button class="jump" data-i="${i}">▶ Play from the beginning<small>Intro + all of Morgan's teachings</small></button>`; }
    else if(t.sectionHead){ return; } // research group header is rendered below
    else if(t.kind==='RESEARCH · TOPIC'){ h=`<button class="jump" data-i="${i}">${t.title}<small>${(t.body||'').slice(0,82)}…</small></button>`; }
    else if(t.kind==='CHAPTER'||t.kind==='BUILD STAGE'){ h=`<div class="chap">${t.title}</div>`; }
    else if(t.episodeHead){ h=`<button class="jump" data-i="${i}">${t.title}<small>${(t.body||'').slice(0,68)}…</small></button>`; }
    if(!h)return;
    if(t.research)res+=h; else mor+=h;
  });
  c.innerHTML =
    `<div class="grphdr" data-g="m"><span class="arw">▾</span> Morgan Clarke Design Masterclass</div><div class="grpbody" id="g-m">${mor}</div>`+
    (res?`<div class="grphdr rsch" data-g="r"><span class="arw">▾</span> My Research <small>— not Morgan's words</small></div><div class="grpbody" id="g-r">${res}</div>`:'');
  c.querySelectorAll('.jump').forEach(b=>b.onclick=()=>{ $('#sheet').classList.remove('open'); playFrom(+b.dataset.i); });
  c.querySelectorAll('.grphdr').forEach(hd=>hd.onclick=()=>{ const b=$('#g-'+hd.dataset.g); const open=b.style.display!=='none'; b.style.display=open?'none':''; hd.querySelector('.arw').textContent=open?'▸':'▾'; });
}
$('#chapbtn').onclick=()=>{ $('#sheet').classList.add('open'); };
$('#sheetclose').onclick=()=>{ $('#sheet').classList.remove('open'); };

/* ---------------- init ---------------- */
function baseNote(){
  const bits=[];
  if(!synth)bits.push('No text-to-speech on this browser.');
  if(!SR)bits.push('Voice input needs Chrome — type below instead.');
  else if(!window.isSecureContext)bits.push('Tip: voice input needs https (run as an artifact or host it). Audio works anywhere.');
  if(!bits.length)bits.push('Tap ASK and speak · or say “next”, “repeat”, “pause”, “principles”.');
  return bits.join(' ');
}
const _mC=TEACH.filter(t=>!t.research).length, _rC=TEACH.filter(t=>t.research).length;
$('#subline').textContent=`${_mC} Morgan teachings · ${_rC} research notes`;
$('#note').textContent=baseNote();
if(!SR)$('#txtwrap').classList.add('show');
document.addEventListener('pointerdown',prime,{once:true});
buildChapters();
show(0);
// nudge voices to load on some browsers
if(synth)setTimeout(loadVoice,300);
</script>
